<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FLA ⇄ AMPROJ 转换器 · 纯前端单文件</title>
<style>
  :root{
	--bg:#12141a; --panel:#1b1e27; --panel2:#232734; --line:#333949;
	--fg:#e8ecf4; --dim:#9aa4b8; --acc:#5aa9ff; --acc2:#39d98a; --warn:#ffb020; --err:#ff5f6d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel)}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.3px}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--dim);border:0;padding:7px 14px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--acc);color:#08111e;font-weight:600}
  main{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 57px)}
  #left{overflow:auto;padding:14px;border-right:1px solid var(--line);background:var(--panel)}
  #right{overflow:auto;padding:14px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .card h2{font-size:12px;margin:0 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  label.file{display:block;border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;color:var(--dim)}
  label.file:hover{border-color:var(--acc);color:var(--fg)}
  input[type=text]{width:100%;background:#141821;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px 8px}
  button.act{background:var(--acc);color:#08111e;border:0;border-radius:8px;padding:9px 14px;font-weight:650;cursor:pointer;width:100%}
  button.act:disabled{opacity:.45;cursor:not-allowed}
  button.gh{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  button.gh:hover{border-color:var(--acc)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  #log{font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:#0e1015;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;color:var(--dim)}
  #log b{color:var(--fg)} #log .ok{color:var(--acc2)} #log .w{color:var(--warn)} #log .e{color:var(--err)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .prev{background:#0e1015;border:1px solid var(--line);border-radius:8px;padding:8px}
  .prev h3{margin:0 0 6px;font-size:11px;color:var(--dim);font-weight:600}
  canvas.prevcv{width:100%;height:auto;background:
	 linear-gradient(45deg,#1a1d26 25%,transparent 25%,transparent 75%,#1a1d26 75%) 0 0/16px 16px,
	 linear-gradient(45deg,#1a1d26 25%,transparent 25%,transparent 75%,#1a1d26 75%) 8px 8px/16px 16px,#0e1015;
	 border-radius:5px;image-rendering:auto}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0;font-size:12px}
  .kv span:last-child{color:var(--fg);font-weight:600}
  .badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700}
  .badge.ok{background:rgba(57,217,138,.16);color:var(--acc2)}
  .badge.bad{background:rgba(255,95,109,.16);color:var(--err)}
  .hint{color:var(--dim);font-size:11px}
  .slider{display:flex;align-items:center;gap:8px}
  input[type=range]{flex:1;accent-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>FLA ⇄ AMPROJ 转换器</h1>
  <span class="tag">纯前端 · 无依赖 · 单文件</span>
  <div class="seg" id="modeSeg">
	<button data-mode="fla2am" class="on">FLA → AM</button>
	<button data-mode="am2fla">AM → FLA</button>
  </div>
  <span class="hint" id="modeHint"></span>
</header>

<main>
  <div id="left">
	<div class="card">
	  <h2>1 · 选择源文件</h2>
	  <label class="file" for="fileIn" id="fileLbl">点击选择 .fla / .amproj<br><span class="hint">文件不会上传，全部在本机浏览器里处理</span></label>
	  <input id="fileIn" type="file" style="display:none"/>
	  <div style="margin-top:8px" class="hint">或从 URL 载入（便于本机联调）：</div>
	  <div class="row" style="margin-top:4px">
		<input type="text" id="urlIn" placeholder="http://localhost:8000/xx.fla"/>
		<button class="gh" id="urlBtn">载入</button>
	  </div>
	</div>

	<div class="card">
	  <h2>2 · 转换参数</h2>
	  <div class="kv"><span>形状超采样 ss</span><span id="ssVal">2</span></div>
	  <input type="range" id="ss" min="1" max="3" step="1" value="2" style="width:100%"/>
	  <div class="kv" style="border:0"><span>烘焙团建滤镜（Blur/Glow）</span><span><input type="checkbox" id="doFilters" checked></span></div>
	  <div class="kv" style="border:0"><span>逆向烘焙帧率</span><span><input type="text" id="rbFps" value="30" style="width:60px;text-align:right"></span></div>
	</div>

	<div class="card">
	  <h2>3 · 执行</h2>
	  <button class="act" id="goBtn" disabled>转换</button>
	  <div class="row" style="margin-top:8px">
		<button class="gh" id="selfTestBtn" disabled>往返自测 (A→B→A)</button>
		<button class="gh" id="dlBtn" disabled>下载结果</button>
	  </div>
	  <div class="hint" id="statLine" style="margin-top:8px"></div>
	</div>

	<div class="card">
	  <h2>日志</h2>
	  <div id="log"></div>
	</div>
  </div>

  <div id="right">
	<div class="card" id="infoCard" style="display:none">
	  <h2>工程信息</h2>
	  <div id="info"></div>
	</div>

	<div class="card">
	  <h2>预览（左=原始 / 右=转换结果 / 下=差异）</h2>
	  <div class="grid2">
		<div class="prev"><h3 id="tA">原始</h3><canvas class="prevcv" id="cvA" width="390" height="390"></canvas></div>
		<div class="prev"><h3 id="tB">转换结果</h3><canvas class="prevcv" id="cvB" width="390" height="390"></canvas></div>
	  </div>
	  <div class="prev" style="margin-top:12px"><h3 id="tD">差异（红=不一致像素）</h3><canvas class="prevcv" id="cvD" width="390" height="390"></canvas></div>
	  <div class="slider" style="margin-top:10px">
		<button class="gh" id="playBtn">▶</button>
		<input type="range" id="frame" min="0" max="0" value="0"/>
		<span class="hint" id="frameLbl">帧 0</span>
	  </div>
	</div>
  </div>
</main>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   0 · 基础工具：日志 / 十六进制 / 哈希 / CRC32
   ══════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
function log(msg, cls){
  const el = $('log');
  const b = document.createElement('div');
  if (cls) b.className = cls;
  b.textContent = msg;
  el.appendChild(b);
  el.scrollTop = el.scrollHeight;
}
function logClear(){ $('log').innerHTML = ''; }
const enc = new TextEncoder(), dec = new TextDecoder('utf-8');
const TWIPS = 20.0;

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/* 一个小而正的 SHA-1（只用于素材签名/文件名，与 Python hashlib.sha1 等价） */
function sha1Hex(bytes){
  const ml = bytes.length * 8;
  const withPad = new Uint8Array((((bytes.length + 8) >> 6) + 1) << 6);
  withPad.set(bytes); withPad[bytes.length] = 0x80;
  const dv = new DataView(withPad.buffer);
  dv.setUint32(withPad.length - 4, ml >>> 0);
  dv.setUint32(withPad.length - 8, Math.floor(ml / 4294967296));
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const w = new Uint32Array(80);
  for (let off = 0; off < withPad.length; off += 64){
	for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
	for (let i = 16; i < 80; i++){ const v = w[i-3]^w[i-8]^w[i-14]^w[i-16]; w[i] = ((v << 1) | (v >>> 31)) >>> 0; }
	let a = h0, b = h1, c = h2, d = h3, e = h4;
	for (let i = 0; i < 80; i++){
	  let f, k;
	  if (i < 20){ f = (b & c) | (~b & d); k = 0x5A827999; }
	  else if (i < 40){ f = b ^ c ^ d; k = 0x6ED9EBA1; }
	  else if (i < 60){ f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
	  else { f = b ^ c ^ d; k = 0xCA62C1D6; }
	  const t = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) >>> 0;
	  e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = t;
	}
	h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  const out = new Uint8Array(20), odv = new DataView(out.buffer);
  odv.setUint32(0,h0); odv.setUint32(4,h1); odv.setUint32(8,h2); odv.setUint32(12,h3); odv.setUint32(16,h4);
  return [...out].map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
}

/* ══════════════════════════════════════════════════════════════════════════
   1 · ZIP：读（扫 local header，兼容坏中央目录）/ 写（STORED，合法 zip）
   ══════════════════════════════════════════════════════════════════════════ */
async function inflateRawBytes(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
/* [坑7] AMPROJ 的 zip 用「数据描述符」写法(flag bit3, local header 里 csize=0)，
   压缩流末尾跟着 12/16 字节描述符，直接整体丢给 DecompressionStream 会报错。
   这里先按长度裁剪，再退化为「逐块读取+容错」兜底。 */
async function inflateRawLenient(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const rd = st.getReader(); const parts = []; let total = 0;
  try {
	for (;;){
	  const { done, value } = await rd.read();
	  if (done) break;
	  if (value){ parts.push(value); total += value.length; }
	}
  } catch (e){ /* 流尾多余字节，忽略：已解出的数据保留 */ }
  const out = new Uint8Array(total); let o = 0;
  for (const q of parts){ out.set(q, o); o += q.length; }
  return out;
}
async function inflateBest(raw){
  for (const cut of [0, 16, 12]){
	const len = raw.length - cut;
	if (len <= 0) break;
	try { return await inflateRawBytes(cut ? raw.subarray(0, len) : raw); } catch (e){}
  }
  return await inflateRawLenient(raw);
}
function findNextLfh(buf, from, n){
  let q = from;
  for (;;){
	q = buf.indexOf(0x50, q);
	if (q < 0 || q + 4 > n) return n;
	if (buf[q+1] === 0x4B && buf[q+2] === 0x03 && buf[q+3] === 0x04) return q;
	q++;
  }
}
async function deflateRawBytes(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
/* [坑6] 有些 FLA（含本工程）的 zip 中央目录被破坏，标准库读不了。
   这里直接扫 PK\x03\x04 local header，逐条还原。 */
async function unzip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const out = new Map();
  let p = 0, guard = 0; const n = buf.length;
  while (p + 30 <= n && guard < 400000){
	guard++;
	if (!(buf[p] === 0x50 && buf[p+1] === 0x4B && buf[p+2] === 0x03 && buf[p+3] === 0x04)){ p++; continue; }
	const method = dv.getUint16(p + 8, true);
	let csize = dv.getUint32(p + 18, true);
	const nl = dv.getUint16(p + 26, true), el = dv.getUint16(p + 28, true);
	if (nl <= 0 || nl > 1024 || p + 30 + nl + el > n){ p += 4; continue; }
	/* [格式二] 部分 FLA(如 ZOMBIE_TUTORIAL_IMP)的 zip 条目名用反斜杠当分隔符
	   (LIBRARY/media\\xxx.png), 不解压成 '/' 就永远匹配不上 href/media 目录。 */
	const name = dec.decode(buf.subarray(p + 30, p + 30 + nl)).replace(/\\/g, '/');
	const ds = p + 30 + nl + el;
	/* [坑7] 数据描述符写法：local header 里 csize=0，真实长度只写在该条数据后面。
	   此时按「下一个 local header」划定本条数据区。 */
	let end;
	if (csize === 0){ end = findNextLfh(buf, ds, n); }
	else { end = Math.min(ds + csize, n); }
	const raw = buf.subarray(ds, end);
	let data = null;
	try {
	  if (method === 0) data = raw.slice();
	  else if (method === 8) data = csize === 0 ? await inflateBest(raw) : await inflateRawBytes(raw);
	} catch (e){ log('  解压失败(跳过) ' + name + ' : ' + e, 'w'); }
	if (data && data.length && !name.endsWith('/')) out.set(name, data);
	if (end <= p) break;
	p = end;
  }
  return out;
}
function zipStore(entries){
  const chunks = [], central = []; let off = 0;
  for (const e of entries){
	const nb = enc.encode(e.name), data = e.data, crc = crc32(data), len = data.length;
	const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
	lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0, true);
	lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
	lv.setUint32(14, crc, true); lv.setUint32(18, len, true); lv.setUint32(22, len, true);
	lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
	lh.set(nb, 30); chunks.push(lh, data);
	const ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
	cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
	cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
	cv.setUint32(16, crc, true); cv.setUint32(20, len, true); cv.setUint32(24, len, true);
	cv.setUint16(28, nb.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
	cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, off, true);
	ch.set(nb, 46); central.push(ch);
	off += lh.length + len;
  }
  const cdOff = off, cdSize = central.reduce((s,c) => s + c.length, 0);
  const eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, cdOff, true); ev.setUint16(20, 0, true);
  const total = off + cdSize + 22;
  const out = new Uint8Array(total); let o = 0;
  for (const c of chunks){ out.set(c, o); o += c.length; }
  for (const c of central){ out.set(c, o); o += c.length; }
  out.set(eocd, o);
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   2 · XML（DOMParser + 按 localName 取，彻底躲开命名空间）
   ══════════════════════════════════════════════════════════════════════════ */
function parseXml(bytes){
  const text = (typeof bytes === 'string') ? bytes : dec.decode(bytes);
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const pe = doc.getElementsByTagName('parsererror')[0];
  if (pe) throw new Error('XML 解析失败: ' + pe.textContent.slice(0, 200));
  return doc;
}
const ch  = (el, name) => { if (!el) return null; for (const c of el.children) if (c.localName === name) return c; return null; };
const chs = (el, name) => { const o = []; if (!el) return o; for (const c of el.children) if (c.localName === name) o.push(c); return o; };
const at  = (el, k, d) => { if (!el) return d; const v = el.getAttribute(k); return v === null ? d : v; };
const atF = (el, k, d) => { const v = at(el, k, null); return v === null || v === '' ? d : parseFloat(v); };
const atI = (el, k, d) => { const v = at(el, k, null); return v === null || v === '' ? d : Math.trunc(parseFloat(v)); };
const atB = (el, k, d) => { const v = at(el, k, null); return v === null ? d : (v === 'true' || v === '1'); };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = v => (Math.abs(v) < 1e-9 ? 0 : v).toFixed(6);

/* ══════════════════════════════════════════════════════════════════════════
   3 · 颜色 / 仿射矩阵
   ══════════════════════════════════════════════════════════════════════════ */
function parseColor(s, alpha){
  const a = (alpha === undefined) ? 1.0 : alpha;
  if (!s) return [0,0,0,a];
  s = String(s).trim();
  let v = null;
  if (s[0] === '#'){ let h = s.slice(1); if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; v = parseInt(h, 16); }
  else if (/^0x/i.test(s)) v = parseInt(s, 16);
  if (v === null || isNaN(v)) return [0,0,0,a];
  return [((v>>16)&255)/255, ((v>>8)&255)/255, (v&255)/255, a];
}
const IDENT = [1,0,0,1,0,0];
function matMul(m1, m2){
  const [a1,b1,c1,d1,x1,y1] = m1, [a2,b2,c2,d2,x2,y2] = m2;
  return [a1*a2+c1*b2, b1*a2+d1*b2, a1*c2+c1*d2, b1*c2+d1*d2, a1*x2+c1*y2+x1, b1*x2+d1*y2+y1];
}
function matApply(m, x, y){ return [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]]; }
function matOf(node){
  const mm = ch(node, 'Matrix');
  if (!mm) return IDENT.slice();
  return [atF(mm,'a',1), atF(mm,'b',0), atF(mm,'c',0), atF(mm,'d',1), atF(mm,'tx',0), atF(mm,'ty',0)];
}
/* Mat -> amproj 量纲 (rot_rad, sx, sy, kx, ky)。与 Python trs_from_fine_decompose 严格同构：
   精确逆分解 R·K·S，ky≡0、kx 承载切变，sy 可负以承载镜像。 */
function trsFromFineDecompose(m){
  const a = m[0], b = m[1], c = m[2], d = m[3];
  const L = Math.hypot(a, b);
  if (L < 1e-12) return [0, 0, Math.hypot(c, d), 0, 0];
  const cs = a / L, sn = b / L;
  const rot = Math.atan2(b, a), sx = L;
  const sy = -sn * c + cs * d;
  const kx = Math.abs(sy) > 1e-12 ? (cs * c + sn * d) / sy : 0;
  return [rot, sx, sy, kx, 0];
}
function composeTrs(rot, sx, sy, kx, ky, tx, ty){
  const cs = Math.cos(rot), sn = Math.sin(rot);
  return [sx*(cs - sn*ky), sx*(sn + cs*ky), sy*(cs*kx - sn), sy*(sn*kx + cs), tx, ty];
}
function lerpMatrix(ma, mb, t){
  const [ra,sxa,sya,kxa] = trsFromFineDecompose(ma);
  const [rb,sxb,syb,kxb] = trsFromFineDecompose(mb);
  const px = ma[4] + (mb[4]-ma[4])*t, py = ma[5] + (mb[5]-ma[5])*t;
  let dr = rb - ra;
  while (dr >  Math.PI) dr -= 2*Math.PI;
  while (dr < -Math.PI) dr += 2*Math.PI;
  return composeTrs(ra + dr*t, sxa+(sxb-sxa)*t, sya+(syb-sya)*t, kxa+(kxb-kxa)*t, 0, px, py);
}

/* ══════════════════════════════════════════════════════════════════════════
   4 · XFL 形状解析（edges / cubics / fills / strokes）

const HEXCH = '0123456789abcdefABCDEF';

			if (!kfs || !kfs.length) continue;

	  const span = Math.max(1, s.endMs - s.startMs);
	  const kfs = s.kfs.slice().sort((a,b)=>a.t-b.t);
	  const tn = t => (t - s.startMs) / span;
	  const ea = e => e ? ` e="cubicBezier ${fmt(e[0])} ${fmt(e[1])} ${fmt(e[2])} ${fmt(e[3])}"` : '';
	  L.push('      <location>');
	  for (const k of kfs) L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(k.loc[0])},${fmt(k.loc[1])},0.000000"${ea(k.ease)} />`);
	  L.push('      </location>');
	  L.push('      <scale>');
	  for (const k of kfs) L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(k.scl[0])},${fmt(k.scl[1])}"${ea(k.ease)} />`);
	  L.push('      </scale>');
	  L.push('      <rotation>');

		}
		prev = v;
		L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(v)}"${ea(k.ease)} />`);
	  }
	  L.push('      </rotation>');
	  if (kfs.some(k => Math.abs(k.skew[0]) > 1e-7 || Math.abs(k.skew[1]) > 1e-7)){
		L.push('      <skew>');
		for (const k of kfs) L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(k.skew[0])},${fmt(k.skew[1])}" />`);
		L.push('      </skew>');
	  }
	  L.push('    </transform>');
	  L.push(`    <property name="size" type="vec2" value="${fmt(s.halfW)},${fmt(s.halfH)}" />`);
	  L.push('  </shape>');

	entries.push({ name: 'manifest.txt', data: enc.encode(manifest) });
	return { bytes: zipStore(entries), xml: xmlText, shapes, totalFrames, totalMs, pngCount: pngs.size, W, H };
  }

function cubicBezierY(u, p){
  const x1=p[0], y1=p[1], x2=p[2], y2=p[3];
  const cx = 3*x1, bx = 3*(x2-x1)-cx, ax = 1-cx-bx;
  const cy = 3*y1, by = 3*(y2-y1)-cy, ay = 1-cy-by;
  let t = u;
  for (let i=0;i<8;i++){
	const x = ((ax*t + bx)*t + cx)*t - u;
	if (Math.abs(x) < 1e-6) break;
	const d = (3*ax*t + 2*bx)*t + cx;
	if (Math.abs(d) < 1e-6) break;
	t = Math.min(1, Math.max(0, t - x/d));
  }
  return ((ay*t + by)*t + cy)*t;
}
function parseTrack(parent, name){
  const el = ch(parent, name);
  const kfs = [];
  if (el) for (const kf of chs(el, 'kf')){
	const v = at(kf,'v','').split(',').map(s => parseFloat(s));
	const eStr = at(kf,'e','');
	let ease = null;
	if (eStr.indexOf('cubicBezier') === 0){
	  const p = eStr.trim().split(/\s+/).slice(1).map(Number);
	  if (p.length >= 4 && p.every(x => isFinite(x))) ease = p.slice(0,4);
	}
	kfs.push({ t: atF(kf,'t',0), v, ease });
  }
  /* [坑8 · 静态轨道] AM 的变换轨道支持「元素级静态值」写法:
	 <scale value="0.184862,0.184862"/>（无任何 kf 子元素）。
	 旧实现只读 kf 子元素, 静态轨道被当成默认值(缩放1/旋转0),
	 导致带静态缩放的素材(如双枪 0.1849 / 0.32)按 1.0 渲染 —— 元件放大 3~5 倍,
	 且该异常随 AM→FLA→AM 往返一直保留。 */
  if (el && !kfs.length){
	const sv = at(el, 'value', '');
	if (sv !== '') kfs.push({ t: 0, v: sv.split(',').map(s => parseFloat(s)), ease: null });
  }
  kfs.sort((a,b) => a.t - b.t);
  return { kfs };
}
function trackAt(track, u, def){
  const kfs = track.kfs;
  if (!kfs.length) return def.slice();
  if (u <= kfs[0].t) return kfs[0].v.slice();
  const last = kfs[kfs.length-1];
  if (u >= last.t) return last.v.slice();
  for (let i=1;i<kfs.length;i++){
	const a = kfs[i-1], b = kfs[i];
	if (a.t <= u && u <= b.t){
	  let uu = (u - a.t) / Math.max(b.t - a.t, 1e-9);
	  if (a.ease) uu = cubicBezierY(uu, a.ease);
	  const n = Math.min(a.v.length, b.v.length), out = [];
	  for (let j=0;j<n;j++) out[j] = a.v[j] + (b.v[j]-a.v[j])*uu;
	  return out;
	}

function parseAmproj(files){

  }

	shapes: [], media: new Map(), textures: new Map(), xmlBytes,

	let sizeEl = null;

	if (sizeEl){ const sv = at(sizeEl,'value','').split(',').map(Number); if (sv.length >= 2){ hw = sv[0]; hh = sv[1]; } }

function renderAmFrame(ctx, model, tMs){
  for (const sh of model.shapes){
	if (tMs < sh.t0 - 1e-6 || tMs > sh.t1 + 1e-6) continue;
	const tex = model.textures.get(sh.img);
	if (!tex) continue;
	const span = Math.max(1, sh.t1 - sh.t0);
	const u = (tMs - sh.t0) / span;
	const loc = trackAt(sh.loc, u, [0,0,0]);
	const scl = trackAt(sh.scl, u, [1,1]);
	const rot = trackAt(sh.rot, u, [0]);
	const skw = trackAt(sh.skw, u, [0,0]);
	const iw = tex.width, ih = tex.height;
	const rw = sh.halfW*2, rh = sh.halfH*2;
	const fit = Math.max(rw/iw, rh/ih);
	const cw = rw/fit, chh = rh/fit;
	const sx = (iw - cw)*0.5, sy = (ih - chh)*0.5;
	const m = composeTrs(rot[0]*Math.PI/180, scl[0], scl[1], skw[0], skw[1], loc[0], loc[1]);
	ctx.save();
	ctx.transform(m[0],m[1],m[2],m[3],m[4],m[5]);
	ctx.drawImage(tex, sx, sy, cw, chh, -rw*0.5, -rh*0.5, rw, rh);
	ctx.restore();
  }

function am2fla(model){

  const mediaByFile = new Map();     // key -> 裁剪后的素材
  for (const sh of model.shapes){
	if (!model.media.has(sh.img)) continue;
	const srcBytes = model.media.get(sh.img);
	const [sw, shh] = pngSize(srcBytes);
	if (!sw) continue;
	const RW = sh.halfW*2, RH = sh.halfH*2;
	/* [关键] AM 的 mediaFillMode="fill" 是「等比放大到完全覆盖 + 居中裁切」(cover):
	   素材被放进 size 矩形(2*halfW × 2*halfH)里, 比例不符时两边被裁掉。
	   而 FLA 的位图实例**不能裁切**, 若直接把整张原图等比放大, 实例外框就成了
	   整张方图(远大于 size 矩形), 元件尺寸整个偏大。
	   所以先把素材按可见区域裁出来, 之后实例外框 = AM 的 size 矩形, 尺寸才一致。
	   [坑8 · 亚像素对齐] AM 的裁切原点是分数 (sxExact/syExact), 裁剪图只能取整;
	   若实例矩阵再用 RW/cw 的近似比例, 内容会整体错位 ~1px(轮廓差异 ~2%)。

	   把裁剪图映射回舞台 —— 每个源像素都落在 AM 本该放它的位置(误差≤边缘半像素)。 */
	const k = Math.max(RW/sw, RH/shh);
	const cw = Math.min(sw, Math.max(1, Math.round(RW/k)));
	const chh = Math.min(shh, Math.max(1, Math.round(RH/k)));
	const sxExact = (sw - RW/k) / 2, syExact = (shh - RH/k) / 2;
	const sx = Math.round(sxExact), sy = Math.round(syExact);

	sh._B = [k, 0, 0, k, (sx - sxExact)*k - RW*0.5, (sy - syExact)*k - RH*0.5];

	     原地停留成残影（原始 FLA 每层内容都铺满全时间线, 从不触发此坑, 故只有
	     转换产物会残影）; ② 一些播放器按「最后一个含元素帧」取帧、无视空白段,
	     同样残影。修复: 全部内容帧/空白帧都用 keyMode="14688"（关键帧/空白关键帧,
	     空白关键帧=显式清空内容）; 并在内容末尾补一帧 1e-4 缩放的「终止帧」
	     （视觉不可见）, 让任何取帧逻辑都只能取到空内容。 */
	if (f0 > 0) parts.push(`            <DOMFrame index="0" keyMode="14688" duration="${f0}"><elements/></DOMFrame>`);
	for (const r of runs){
	  parts.push(`            <DOMFrame index="${idx}" keyMode="14688" duration="${r.d}">`);
	  parts.push('              <elements>');
	  parts.push(`                <DOMBitmapInstance libraryItemName="${esc(med.name)}">`);
	  parts.push('                  <matrix>');
	  parts.push(`                    <Matrix a="${fmt(r.m[0])}" b="${fmt(r.m[1])}" c="${fmt(r.m[2])}" d="${fmt(r.m[3])}" tx="${fmt(r.m[4])}" ty="${fmt(r.m[5])}"/>`);
	  parts.push('                  </matrix>');
	  parts.push('                </DOMBitmapInstance>');
	  parts.push('              </elements>');
	  parts.push('            </DOMFrame>');
	  idx += r.d;
	}
	if (idx < totalFrames && runs.length){
	  /* 终止帧：复制最后一个矩阵但缩放 ×1e-4（亚像素级, 任何播放器都画不出来） */
	  const lm = runs[runs.length-1].m;
	  parts.push(`            <DOMFrame index="${idx}" keyMode="14688" duration="1">`);
	  parts.push('              <elements>');
	  parts.push(`                <DOMBitmapInstance libraryItemName="${esc(med.name)}">`);
	  parts.push('                  <matrix>');
	  parts.push(`                    <Matrix a="${fmt(lm[0]*1e-4)}" b="${fmt(lm[1]*1e-4)}" c="${fmt(lm[2]*1e-4)}" d="${fmt(lm[3]*1e-4)}" tx="${fmt(lm[4])}" ty="${fmt(lm[5])}"/>`);
	  parts.push('                  </matrix>');
	  parts.push('                </DOMBitmapInstance>');
	  parts.push('              </elements>');
	  parts.push('            </DOMFrame>');
	  idx += 1;
	}
	if (idx < totalFrames) parts.push(`            <DOMFrame index="${idx}" keyMode="14688" duration="${totalFrames-idx}"><elements/></DOMFrame>`);
	parts.push('          </frames>');
	parts.push('        </DOMLayer>');
	layerXml.push(parts.join('\n'));
  }
  totalFrames = Math.max(totalFrames, maxEndFrame);
  /* ── DOMDocument.xml ── */
  const D = [];
  D.push("<?xml version='1.0' encoding='UTF-8' ?>");
  D.push('<!-- 由 FLA⇄AMPROJ 网页转换器 从 Alight Motion 工程逆向转换而来 -->');
  /* 文档头带上 Animate 标准 XFL 属性（xflVersion/creatorInfo/版本号/灭点）,
	 提升严格导入器的兼容性; 真实来源已在上方注释声明。 */
  D.push('<DOMDocument xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns="http://ns.adobe.com/xfl/2008/"');
  D.push('  xflVersion="2.971" creatorInfo="Adobe Animate" platform="Windows" versionInfo="Saved by Animate Windows 20.0 build 17400" majorVersion="20" buildNumber="17400"');
  D.push(`  width="${W}" height="${H}" frameRate="${fps}" backgroundColor="${model.bgcolor || '#FFFFFF'}" currentTimeline="1" vanishingPoint3DX="${Math.round(W/2)}" vanishingPoint3DY="${Math.round(H/2)}">`);
  D.push('  <folders>');
  D.push('    <DOMFolderItem name="media" itemID="c0nv0000-00000001" isExpanded="true"/>');
  D.push('  </folders>');
  /* 段落顺序与真实 Animate 导出一致: folders → media → symbols → timelines */
  D.push('  <media>');
  let item = 0;
  const orderedMedia = [...mediaByFile.values()];
  for (const m of orderedMedia){
	item++;
	/* 与第二种 FLA 的 DOMBitmapItem 字段对齐: href/bitmapDataHRef 指向
	   media/<file>, 并补上 frameRight/frameBottom(twip, 1px=20twip)。 */
	const href = 'media/' + m.file;
	D.push(`    <DOMBitmapItem name="${esc(m.name)}" itemID="${String(item).padStart(8,'0')}" href="${esc(href)}" bitmapDataHRef="${esc(href)}" sourceExternalFilepath="./LIBRARY/${esc(href)}" sourceLastImported="0" externalFileSize="${m.bytes.length}" originalCompressionType="lossless" frameRight="${Math.round(m.iw*20)}" frameBottom="${Math.round(m.ih*20)}" allowSmoothing="true" useImportedJPEGData="false" compressionType="lossless" quality="100"/>`);
  }
  D.push('  </media>');
  D.push('  <symbols/>');
  D.push('  <timelines>');
  D.push('    <DOMTimeline name="场景 1">');
  D.push('      <layers>');
  D.push(layerXml.reverse().join('\n'));
  D.push('      </layers>');
  D.push('    </DOMTimeline>');
  D.push('  </timelines>');
  D.push('</DOMDocument>');
  const entries = [
	{ name: 'mimetype', data: enc.encode('application/vnd.adobe.xfl') },
	{ name: 'DOMDocument.xml', data: enc.encode(D.join('\n') + '\n') },
  ];
  /* 位图实体按第二种 FLA 的库路径 LIBRARY/media/ 存放 */
  for (const m of orderedMedia) entries.push({ name: 'LIBRARY/media/' + m.file, data: m.bytes });
  return { bytes: zipStore(entries), xml: D.join('\n'), layers: layerXml.length, media: orderedMedia.length, totalFrames, W, H, fps };
}
/* ══════════════════════════════════════════════════════════════════════════
   10 · 界面逻辑：模式切换 / 转换 / 预览 / 往返自测 / 下载
   ══════════════════════════════════════════════════════════════════════════ */
let MODE = 'fla2am';
let SRC = null;            // { name, bytes }
let OUT = null;            // { name, bytes, kind }
let PV  = null;            // 预览状态
let PLAYING = false;

function setMode(m){
  MODE = m;
  for (const b of $('modeSeg').children) b.classList.toggle('on', b.dataset.mode === m);
  $('modeHint').textContent = m === 'fla2am'
	? '读入 Adobe Animate 工程(.fla/.xfl)，自动识别两种 FLA 格式（第一种纯矢量 / 第二种位图素材），输出 Alight Motion 工程(.amproj)'
	: '读入 Alight Motion 工程(.amproj)，输出 Adobe Animate 工程(.fla)（第二种格式：LIBRARY/media 位图素材）';
  $('fileLbl').innerHTML = (m === 'fla2am' ? '点击选择 .fla / .xfl（两种格式自动识别）' : '点击选择 .amproj')
	+ '<br><span class="hint">文件不会上传，全部在本机浏览器里处理</span>';
  $('statLine').textContent = '';
  OUT = null; PV = null; $('dlBtn').disabled = true;
}
for (const b of $('modeSeg').children) b.onclick = () => setMode(b.dataset.mode);

$('ss').oninput = () => { $('ssVal').textContent = $('ss').value; };
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  SRC = { name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) };
  $('fileLbl').innerHTML = '已选择：<b>' + esc(f.name) + '</b><br><span class="hint">'
	+ (SRC.bytes.length/1024).toFixed(0) + ' KB</span>';
  $('goBtn').disabled = false; $('selfTestBtn').disabled = false;
};
$('urlBtn').onclick = async () => {
  const u = $('urlIn').value.trim(); if (!u) return;
  try {
	log('载入 ' + u + ' …');
	const r = await fetch(u); if (!r.ok) throw new Error('HTTP ' + r.status);
	const buf = new Uint8Array(await r.arrayBuffer());
	SRC = { name: u.split('/').pop() || 'input', bytes: buf };
	$('fileLbl').innerHTML = '已载入：<b>' + esc(SRC.name) + '</b><br><span class="hint">'
	  + (buf.length/1024).toFixed(0) + ' KB</span>';
	$('goBtn').disabled = false; $('selfTestBtn').disabled = false;
	log('已载入 ' + (buf.length/1024).toFixed(0) + ' KB', 'ok');
  } catch(e){ log('载入失败: ' + e.message, 'e'); }
};
$('goBtn').onclick = async () => { try { await runConvert(); } catch(e){ log('错误: ' + (e.stack||e.message), 'e'); } };
$('selfTestBtn').onclick = async () => { try { await selfTest(); } catch(e){ log('错误: ' + (e.stack||e.message), 'e'); } };
$('dlBtn').onclick = () => {
  if (!OUT) return;
  const blob = new Blob([OUT.bytes], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = OUT.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  log('已下载 ' + OUT.name, 'ok');
};

const baseName = n => n.replace(/\.(fla|xfl|amproj|zip)$/i, '');
function makePreviewStateA(){ }

async function runConvert(){
  if (!SRC) return;
  logClear();
  log('模式: ' + (MODE === 'fla2am' ? 'FLA → AM' : 'AM → FLA'));
  log('解压 ' + SRC.name + ' …');
  const files = await unzip(SRC.bytes);
  log('  条目数: ' + files.size, 'ok');
  if (MODE === 'fla2am'){
	const doc = loadDoc(files);
	const fmt = flaFormatOf(doc);
	log('  FLA 格式：' + fmt.name + '（自动识别）', 'ok');
	log('  FLA: ' + doc.width + 'x' + doc.height + ' @' + doc.fps + 'fps, 元件 '
		+ doc.symbols.size + ' 个, 主图层 ' + (doc.main ? doc.main.layers.length : 0)
		+ (fmt.bitmapCount ? ', 位图素材 ' + fmt.bitmapCount + ' 张' : ''), 'ok');
	if (doc.bitmapItems.size) await decodeFlaBitmaps(doc);
	const ss = parseInt($('ss').value, 10) || 2;
	const doFilters = $('doFilters').checked;
	const t0 = performance.now();
	const conv = new Fla2Am(doc, ss, { doFilters });
	const res = conv.writeAmproj(baseName(SRC.name));
	const ms = performance.now() - t0;
	OUT = { name: baseName(SRC.name) + '.amproj', bytes: res.bytes, kind: 'amproj' };
	log('  输出 ' + res.shapes.length + ' 个 shape / ' + res.pngCount + ' 张 PNG, '
		+ (res.bytes.length/1024).toFixed(0) + ' KB，耗时 ' + ms.toFixed(0) + 'ms', 'ok');
	const amFiles = await unzip(res.bytes);
	const model = parseAmproj(amFiles);
	await decodeAmTextures(model);
	PV = { mode:'fla2am', W:doc.width, H:doc.height, fps:doc.fps, doc, model,
		   totalFrames: Math.max(1, Math.round(res.totalMs/1000*doc.fps)), bgA: doc.bg, bgB: model.bgcolor };
	$('info').innerHTML = kv('画布', doc.width + ' × ' + doc.height)
	  + kv('帧率', doc.fps + ' fps') + kv('总帧数', PV.totalFrames)
	  + kv('FLA 格式', '第' + (fmt.code === 2 ? '二' : '一') + '种')
	  + kv('元件数', doc.symbols.size) + kv('输出 shape', res.shapes.length)
	  + kv('素材 PNG', res.pngCount);
	$('tA').textContent = '原始 FLA'; $('tB').textContent = '转换后 AMPROJ';
  } else {
	const model = parseAmproj(files);
	await decodeAmTextures(model);
	log('  AM: ' + model.width + 'x' + model.height + ' @' + model.fps + 'fps, shape '
		+ model.shapes.length + ' 个, 素材 ' + model.media.size + ', 时长 '
		+ model.totalTime.toFixed(0) + 'ms', 'ok');
	const t0 = performance.now();
	const res = am2fla(model);
	const ms = performance.now() - t0;
	OUT = { name: baseName(SRC.name) + '.fla', bytes: res.bytes, kind: 'fla' };
	log('  输出 ' + res.layers + ' 图层 / ' + res.media + ' 位图, '
		+ (res.bytes.length/1024).toFixed(0) + ' KB，耗时 ' + ms.toFixed(0) + 'ms', 'ok');
	const flaFiles = await unzip(res.bytes);
	const doc = loadDoc(flaFiles);
	await decodeFlaBitmaps(doc);
	PV = { mode:'am2fla', W:model.width, H:model.height, fps:model.fps, doc, model,
		   totalFrames: Math.max(1, res.totalFrames), bgA: model.bgcolor, bgB: doc.bg };
	$('info').innerHTML = kv('画布', model.width + ' × ' + model.height)
	  + kv('帧率', model.fps + ' fps') + kv('总帧数', PV.totalFrames)
	  + kv('AM shape', model.shapes.length) + kv('输出图层', res.layers)
	  + kv('位图素材', res.media);
	$('tA').textContent = '原始 AMPROJ'; $('tB').textContent = '转换后 FLA';
  }
  const fr = $('frame'); fr.max = String(PV.totalFrames - 1); fr.value = '0';
  $('infoCard').style.display = '';
  $('dlBtn').disabled = false;
  $('statLine').textContent = '完成：' + OUT.name;
  paintPreview(0);
}
function kv(k, v){ return '<div class="kv"><span>' + esc(k) + '</span><span>' + esc(String(v)) + '</span></div>'; }

function drawSide(ctx, side, frameIdx){
  const st = PV;
  const tMs = frameIdx / st.fps * 1000;
  const bg = (side === 'A') ? st.bgA : st.bgB;
  if (bg){ ctx.fillStyle = bg; ctx.fillRect(0, 0, st.W, st.H); }
  if (side === 'A'){
	if (st.mode === 'fla2am') renderTimeline(ctx, st.doc.main, frameIdx, st.doc, 0);
	else renderAmFrame(ctx, st.model, tMs);
  } else {
	if (st.mode === 'fla2am') renderAmFrame(ctx, st.model, tMs);
	else renderTimeline(ctx, st.doc.main, frameIdx, st.doc, 0);
  }
}
function putScaled(dst, src){
  const ctx = dst.getContext('2d');
  ctx.clearRect(0, 0, dst.width, dst.height);
  const s = Math.min(dst.width/src.width, dst.height/src.height);
  const dw = src.width*s, dh = src.height*s;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, (dst.width-dw)/2, (dst.height-dh)/2, dw, dh);
}
function diffCanvases(a, b){
  const ca = a.getContext('2d').getImageData(0, 0, a.width, a.height);
  const cb = b.getContext('2d').getImageData(0, 0, b.width, b.height);
  const out = newCanvas(a.width, a.height);
  const oc = out.getContext('2d'), od = oc.createImageData(a.width, a.height);
  let bad = 0;
  for (let i=0;i<ca.data.length;i+=4){
	const d = Math.max(Math.abs(ca.data[i]-cb.data[i]), Math.abs(ca.data[i+1]-cb.data[i+1]),
					   Math.abs(ca.data[i+2]-cb.data[i+2]), Math.abs(ca.data[i+3]-cb.data[i+3]));
	if (d > 40){ bad++; od.data[i]=255; od.data[i+1]=70; od.data[i+2]=70; od.data[i+3]=255; }
	else { od.data[i+3]=0; }
  }
  oc.putImageData(od, 0, 0);
  return { canvas: out, pct: 100*bad/(a.width*a.height) };
}
function paintPreview(idx){
  if (!PV) return;
  idx = Math.max(0, Math.min(idx, PV.totalFrames - 1));
  $('frame').value = String(idx);
  $('frameLbl').textContent = '帧 ' + idx + ' / ' + (PV.totalFrames - 1)
	+ '  (' + (idx/PV.fps*1000).toFixed(0) + 'ms)';
  const offA = newCanvas(PV.W, PV.H), offB = newCanvas(PV.W, PV.H);
  drawSide(offA.getContext('2d'), 'A', idx);
  drawSide(offB.getContext('2d'), 'B', idx);
  putScaled($('cvA'), offA); putScaled($('cvB'), offB);
  const d = diffCanvases(offA, offB);
  putScaled($('cvD'), d.canvas);
  $('tD').textContent = '差异（红=不一致像素，' + d.pct.toFixed(2) + '%）';
}
$('frame').oninput = () => paintPreview(parseInt($('frame').value, 10));
$('playBtn').onclick = () => {
  PLAYING = !PLAYING;
  $('playBtn').textContent = PLAYING ? '⏸' : '▶';
  const step = () => {
	if (!PLAYING || !PV) return;
	let f = parseInt($('frame').value, 10) + 1;
	if (f >= PV.totalFrames) f = 0;
	paintPreview(f);
	setTimeout(step, 1000/PV.fps);
  };
  if (PLAYING) step();
};

/* 往返自测：源 →(A)→ 中间 →(B)→ 回到源格式，逐帧比对 */
async function selfTest(){
  if (!SRC) return;
  logClear();
  log('往返自测开始…', 'ok');
  const files = await unzip(SRC.bytes);
  const sampleFrames = 12;
  if (MODE === 'fla2am'){
	const doc0 = loadDoc(files); if (doc0.bitmapItems.size) await decodeFlaBitmaps(doc0);
	const conv = new Fla2Am(doc0, 2, { doFilters: $('doFilters').checked });
	const r1 = conv.writeAmproj(baseName(SRC.name));
	const files1 = await unzip(r1.bytes);
	const model = parseAmproj(files1); await decodeAmTextures(model);
	const r2 = am2fla(model);
	const files2 = await unzip(r2.bytes);
	const doc1 = loadDoc(files2); await decodeFlaBitmaps(doc1);
	const fps = doc0.fps, total = timelineFrames(doc0.main);
	const errs = compareFla(doc0, doc1, fps, total, sampleFrames);
	report(errs, 'FLA→AM→FLA');
  } else {
	const model0 = parseAmproj(files); await decodeAmTextures(model0);
	const r1 = am2fla(model0);
	const files1 = await unzip(r1.bytes);
	const doc = loadDoc(files1); await decodeFlaBitmaps(doc);
	const conv = new Fla2Am(doc, 2);
	const r2 = conv.writeAmproj(baseName(SRC.name));
	const files2 = await unzip(r2.bytes);
	const model1 = parseAmproj(files2); await decodeAmTextures(model1);
	const fps = model0.fps, total = Math.max(1, Math.round(model0.totalTime/1000*fps));
	const errs = compareAm(model0, model1, fps, total, sampleFrames);
	report(errs, 'AM→FLA→AM');
  }
}
function report(errs, label){
  const avg = errs.reduce((s,e)=>s+e.pct,0)/Math.max(1,errs.length);
  const worst = errs.reduce((a,b)=>b.pct>a.pct?b:a, errs[0] || {pct:0});
  log('往返 ' + label + '：采样 ' + errs.length + ' 帧', 'ok');
  log('  平均不一致率 ' + avg.toFixed(2) + '%，最差 ' + worst.pct.toFixed(2)
	  + '% @帧' + worst.frame, avg < 2 ? 'ok' : 'w');
  log(avg < 3 ? '  ✓ 往返后图形基本一致（可正常打开/播放）'
			  : '  ⚠ 存在可见偏差，可调 ss 或检查细节', avg < 3 ? 'ok' : 'w');
}
function compareFla(docA, docB, fps, total, n){
  const errs = [];
  for (let i=0;i<n;i++){
	const fr = Math.round(i * (total-1) / Math.max(1, n-1));
	const a = newCanvas(docA.width, docA.height), b = newCanvas(docB.width, docB.height);
	const ca = a.getContext('2d'), cb = b.getContext('2d');
	ca.fillStyle = docA.bg; ca.fillRect(0,0,a.width,a.height);
	cb.fillStyle = docB.bg; cb.fillRect(0,0,b.width,b.height);
	renderTimeline(ca, docA.main, fr, docA, 0);
	renderTimeline(cb, docB.main, fr, docB, 0);
	errs.push({ frame: fr, pct: diffCanvases(a, b).pct });
  }
  return errs;
}
function compareAm(modelA, modelB, fps, total, n){
  const errs = [];
  for (let i=0;i<n;i++){
	const fr = Math.round(i * (total-1) / Math.max(1, n-1));
	const tms = fr/fps*1000;
	const a = newCanvas(modelA.width, modelA.height), b = newCanvas(modelB.width, modelB.height);
	const ca = a.getContext('2d'), cb = b.getContext('2d');
	ca.fillStyle = modelA.bgcolor; ca.fillRect(0,0,a.width,a.height);
	cb.fillStyle = modelB.bgcolor; cb.fillRect(0,0,b.width,b.height);
	renderAmFrame(ca, modelA, tms);
	renderAmFrame(cb, modelB, tms);
	errs.push({ frame: fr, pct: diffCanvases(a, b).pct });
  }
  return errs;
}
setMode('fla2am');
log('就绪。选择 .fla 或 .amproj 后点「转换」。', 'ok');
