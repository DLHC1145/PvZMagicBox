<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FLA ⇄ AMPROJ 转换器 · 纯前端单文件</title>
<style>
  :root{
	--bg:#12141a; --panel:#1b1e27; --panel2:#232734; --line:#333949;
	--fg:#e8ecf4; --dim:#9aa4b8; --acc:#5aa9ff; --acc2:#39d98a; --warn:#ffb020; --err:#ff5f6d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel)}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.3px}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--dim);border:0;padding:7px 14px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--acc);color:#08111e;font-weight:600}
  main{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 57px)}
  #left{overflow:auto;padding:14px;border-right:1px solid var(--line);background:var(--panel)}
  #right{overflow:auto;padding:14px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .card h2{font-size:12px;margin:0 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  label.file{display:block;border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;color:var(--dim)}
  label.file:hover{border-color:var(--acc);color:var(--fg)}
  input[type=text]{width:100%;background:#141821;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px 8px}
  button.act{background:var(--acc);color:#08111e;border:0;border-radius:8px;padding:9px 14px;font-weight:650;cursor:pointer;width:100%}
  button.act:disabled{opacity:.45;cursor:not-allowed}
  button.gh{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  button.gh:hover{border-color:var(--acc)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  #log{font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:#0e1015;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;color:var(--dim)}
  #log b{color:var(--fg)} #log .ok{color:var(--acc2)} #log .w{color:var(--warn)} #log .e{color:var(--err)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .prev{background:#0e1015;border:1px solid var(--line);border-radius:8px;padding:8px}
  .prev h3{margin:0 0 6px;font-size:11px;color:var(--dim);font-weight:600}
  canvas.prevcv{width:100%;height:auto;background:
	 linear-gradient(45deg,#1a1d26 25%,transparent 25%,transparent 75%,#1a1d26 75%) 0 0/16px 16px,
	 linear-gradient(45deg,#1a1d26 25%,transparent 25%,transparent 75%,#1a1d26 75%) 8px 8px/16px 16px,#0e1015;
	 border-radius:5px;image-rendering:auto}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0;font-size:12px}
  .kv span:last-child{color:var(--fg);font-weight:600}
  .badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700}
  .badge.ok{background:rgba(57,217,138,.16);color:var(--acc2)}
  .badge.bad{background:rgba(255,95,109,.16);color:var(--err)}
  .hint{color:var(--dim);font-size:11px}
  .slider{display:flex;align-items:center;gap:8px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .lblrow{display:grid;grid-template-columns:0.8fr 0.8fr 1.2fr 1.1fr 0.7fr 26px;gap:5px;align-items:center;margin-bottom:6px}
  .lblrow input{width:100%;background:#141821;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:5px 6px;font-size:12px}
  .lblrow .del{background:var(--panel2);border:1px solid var(--line);color:var(--err);border-radius:6px;cursor:pointer;height:26px}
  .lblrow input.bad{border-color:var(--err)}
  .lblhead{display:grid;grid-template-columns:0.8fr 0.8fr 1.2fr 1.1fr 0.7fr 26px;gap:5px;font-size:11px;color:var(--dim);margin-bottom:4px}
  .badge.warn{background:rgba(255,176,32,.16);color:var(--warn)}
  code{background:#141821;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<header>
  <h1>FLA ⇄ AMPROJ 转换器</h1>
  <span class="tag">纯前端 · 无依赖 · 单文件</span>
  <div class="seg" id="modeSeg">
	<button data-mode="fla2am" class="on">FLA → AM</button>
	<button data-mode="am2fla">AM → FLA</button>
	<button data-mode="pam2am">原版三件套 → AM</button>
	<button data-mode="am2pam">AM → 原版三件套</button>
  </div>
  <span class="hint" id="modeHint"></span>
</header>

<main>
  <div id="left">
	<div class="card">
	  <h2>1 · 选择源文件</h2>
	  <label class="file" for="fileIn" id="fileLbl">点击选择 .fla / .amproj<br><span class="hint">文件不会上传，全部在本机浏览器里处理</span></label>
	  <input id="fileIn" type="file" multiple style="display:none"/>
	  <div style="margin-top:8px" class="hint">或从 URL 载入（便于本机联调）：</div>
	  <div class="row" style="margin-top:4px">
		<input type="text" id="urlIn" placeholder="http://localhost:8000/xx.fla"/>
		<button class="gh" id="urlBtn">载入</button>
	  </div>
	</div>

	<div class="card">
	  <h2>2 · 转换参数</h2>
	  <div class="kv"><span>形状超采样 ss</span><span id="ssVal">2</span></div>
	  <input type="range" id="ss" min="1" max="3" step="1" value="2" style="width:100%"/>
	  <div class="kv" style="border:0"><span>烘焙团建滤镜（Blur/Glow）</span><span><input type="checkbox" id="doFilters" checked></span></div>
	  <div class="kv" style="border:0"><span>逆向烘焙帧率</span><span><input type="text" id="rbFps" value="30" style="width:60px;text-align:right"></span></div>
	</div>

	<div class="card" id="labelCard" style="display:none">
	  <h2>2.5 · Label 帧区间配置（AM → 原版必须填）</h2>
	  <div class="hint" style="margin-bottom:6px">
		每行定义一个 label：<b>起始帧 / 结束帧 / 名称</b>。区间必须连续、不重叠、不逆序。
		默认已填 <code>all</code>（首帧~末帧），可改可增删。
	  </div>
	  <div id="labelRows"></div>
	  <div class="row" style="margin-top:8px">
		<button class="gh" id="labelAddBtn">+ 新建 label</button>
		<button class="gh" id="labelAutoBtn">按素材自动分组</button>
		<button class="gh" id="labelMemoBtn" title="按 pam_memo.txt 记录的逐帧 label 分组（帧号最准，推荐）；帧数对不上时按比例映射">按备忘录分组</button>
		<button class="gh" id="labelAllBtn">重置为 all</button>
	  </div>
	  <div class="row" style="margin-top:6px">
		<span class="hint" style="margin-right:6px">套用预设：</span>
		<button class="gh" id="labelPresetBonkchoy" title="菜问全套 12 段标签（含 use_special）">菜问 12 段</button>
		<button class="gh" id="labelPresetRa" title="僵尸全套 8 段标签">僵尸 8 段</button>
	  </div>
	  <datalist id="labelVocab"></datalist>
  <datalist id="cmdVocab"></datalist>
	  <div class="hint" id="labelMsg" style="margin-top:8px"></div>
	</div>

	<div class="card">
	  <h2>3 · 执行</h2>
	  <button class="act" id="goBtn" disabled>转换</button>
	  <div class="row" style="margin-top:8px">
		<button class="gh" id="selfTestBtn" disabled>往返自测 (A→B→A)</button>
		<button class="gh" id="dlBtn" disabled>下载结果</button>
		<button class="gh" id="dlMemoBtn" disabled title="格式备忘录：记录逐帧 label / stop / command、元件名、sprite 定义、res 与资源路径。AM 编辑会丢失它，需单独保存，下次与新 amproj 一起上传">下载备忘录 txt</button>
	  </div>
	  <div class="hint" id="statLine" style="margin-top:8px"></div>
	</div>

	<div class="card">
	  <h2>日志</h2>
	  <div id="log"></div>
	</div>
  </div>

  <div id="right">
	<div class="card" id="infoCard" style="display:none">
	  <h2>工程信息</h2>
	  <div id="info"></div>
	</div>

	<div class="card">
	  <h2>预览（左=原始 / 右=转换结果 / 下=差异）</h2>
	  <div class="grid2">
		<div class="prev"><h3 id="tA">原始</h3><canvas class="prevcv" id="cvA" width="390" height="390"></canvas></div>
		<div class="prev"><h3 id="tB">转换结果</h3><canvas class="prevcv" id="cvB" width="390" height="390"></canvas></div>
	  </div>
	  <div class="prev" style="margin-top:12px"><h3 id="tD">差异（红=不一致像素）</h3><canvas class="prevcv" id="cvD" width="390" height="390"></canvas></div>
	  <div class="slider" style="margin-top:10px">
		<button class="gh" id="playBtn">▶</button>
		<input type="range" id="frame" min="0" max="0" value="0"/>
		<span class="hint" id="frameLbl">帧 0</span>
	  </div>
	</div>
  </div>
</main>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   0 · 基础工具：日志 / 十六进制 / 哈希 / CRC32
   ══════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
function log(msg, cls){
  const el = $('log');
  const b = document.createElement('div');
  if (cls) b.className = cls;
  b.textContent = msg;
  el.appendChild(b);
  el.scrollTop = el.scrollHeight;
}
function logClear(){ $('log').innerHTML = ''; }
const enc = new TextEncoder(), dec = new TextDecoder('utf-8');
const TWIPS = 20.0;

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/* 一个小而正的 SHA-1（只用于素材签名/文件名，与 Python hashlib.sha1 等价） */
function sha1Hex(bytes){
  const ml = bytes.length * 8;
  const withPad = new Uint8Array((((bytes.length + 8) >> 6) + 1) << 6);
  withPad.set(bytes); withPad[bytes.length] = 0x80;
  const dv = new DataView(withPad.buffer);
  dv.setUint32(withPad.length - 4, ml >>> 0);
  dv.setUint32(withPad.length - 8, Math.floor(ml / 4294967296));
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const w = new Uint32Array(80);
  for (let off = 0; off < withPad.length; off += 64){
	for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
	for (let i = 16; i < 80; i++){ const v = w[i-3]^w[i-8]^w[i-14]^w[i-16]; w[i] = ((v << 1) | (v >>> 31)) >>> 0; }
	let a = h0, b = h1, c = h2, d = h3, e = h4;
	for (let i = 0; i < 80; i++){
	  let f, k;
	  if (i < 20){ f = (b & c) | (~b & d); k = 0x5A827999; }
	  else if (i < 40){ f = b ^ c ^ d; k = 0x6ED9EBA1; }
	  else if (i < 60){ f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
	  else { f = b ^ c ^ d; k = 0xCA62C1D6; }
	  const t = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) >>> 0;
	  e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = t;
	}
	h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  const out = new Uint8Array(20), odv = new DataView(out.buffer);
  odv.setUint32(0,h0); odv.setUint32(4,h1); odv.setUint32(8,h2); odv.setUint32(12,h3); odv.setUint32(16,h4);
  return [...out].map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
}

/* ══════════════════════════════════════════════════════════════════════════
   1 · ZIP：读（扫 local header，兼容坏中央目录）/ 写（STORED，合法 zip）
   ══════════════════════════════════════════════════════════════════════════ */
async function inflateRawBytes(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
/* [坑7] AMPROJ 的 zip 用「数据描述符」写法(flag bit3, local header 里 csize=0)，
   压缩流末尾跟着 12/16 字节描述符，直接整体丢给 DecompressionStream 会报错。
   这里先按长度裁剪，再退化为「逐块读取+容错」兜底。 */
async function inflateRawLenient(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const rd = st.getReader(); const parts = []; let total = 0;
  try {
	for (;;){
	  const { done, value } = await rd.read();
	  if (done) break;
	  if (value){ parts.push(value); total += value.length; }
	}
  } catch (e){ /* 流尾多余字节，忽略：已解出的数据保留 */ }
  const out = new Uint8Array(total); let o = 0;
  for (const q of parts){ out.set(q, o); o += q.length; }
  return out;
}
async function inflateBest(raw){
  for (const cut of [0, 16, 12]){
	const len = raw.length - cut;
	if (len <= 0) break;
	try { return await inflateRawBytes(cut ? raw.subarray(0, len) : raw); } catch (e){}
  }
  return await inflateRawLenient(raw);
}
function findNextLfh(buf, from, n){
  let q = from;
  for (;;){
	q = buf.indexOf(0x50, q);
	if (q < 0 || q + 4 > n) return n;
	if (buf[q+1] === 0x4B && buf[q+2] === 0x03 && buf[q+3] === 0x04) return q;
	q++;
  }
}
async function deflateRawBytes(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
/* [坑6] 有些 FLA（含本工程）的 zip 中央目录被破坏，标准库读不了。
   这里直接扫 PK\x03\x04 local header，逐条还原。 */
async function unzip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const out = new Map();
  let p = 0, guard = 0; const n = buf.length;
  while (p + 30 <= n && guard < 400000){
	guard++;
	if (!(buf[p] === 0x50 && buf[p+1] === 0x4B && buf[p+2] === 0x03 && buf[p+3] === 0x04)){ p++; continue; }
	const method = dv.getUint16(p + 8, true);
	let csize = dv.getUint32(p + 18, true);
	const nl = dv.getUint16(p + 26, true), el = dv.getUint16(p + 28, true);
	if (nl <= 0 || nl > 1024 || p + 30 + nl + el > n){ p += 4; continue; }
	/* [格式二] 部分 FLA(如 ZOMBIE_TUTORIAL_IMP)的 zip 条目名用反斜杠当分隔符
	   (LIBRARY/media\\xxx.png), 不解压成 '/' 就永远匹配不上 href/media 目录。 */
	const name = dec.decode(buf.subarray(p + 30, p + 30 + nl)).replace(/\\/g, '/');
	const ds = p + 30 + nl + el;
	/* [坑7] 数据描述符写法：local header 里 csize=0，真实长度只写在该条数据后面。
	   此时按「下一个 local header」划定本条数据区。 */
	let end;
	if (csize === 0){ end = findNextLfh(buf, ds, n); }
	else { end = Math.min(ds + csize, n); }
	const raw = buf.subarray(ds, end);
	let data = null;
	try {
	  if (method === 0) data = raw.slice();
	  else if (method === 8) data = csize === 0 ? await inflateBest(raw) : await inflateRawBytes(raw);
	} catch (e){ log('  解压失败(跳过) ' + name + ' : ' + e, 'w'); }
	if (data && data.length && !name.endsWith('/')) out.set(name, data);
	if (end <= p) break;
	p = end;
  }
  return out;
}
function zipStore(entries){
  const chunks = [], central = []; let off = 0;
  for (const e of entries){
	const nb = enc.encode(e.name), data = e.data, crc = crc32(data), len = data.length;
	const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
	lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0, true);
	lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
	lv.setUint32(14, crc, true); lv.setUint32(18, len, true); lv.setUint32(22, len, true);
	lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
	lh.set(nb, 30); chunks.push(lh, data);
	const ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
	cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
	cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
	cv.setUint32(16, crc, true); cv.setUint32(20, len, true); cv.setUint32(24, len, true);
	cv.setUint16(28, nb.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
	cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, off, true);
	ch.set(nb, 46); central.push(ch);
	off += lh.length + len;
  }
  const cdOff = off, cdSize = central.reduce((s,c) => s + c.length, 0);
  const eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, cdOff, true); ev.setUint16(20, 0, true);
  const total = off + cdSize + 22;
  const out = new Uint8Array(total); let o = 0;
  for (const c of chunks){ out.set(c, o); o += c.length; }
  for (const c of central){ out.set(c, o); o += c.length; }
  out.set(eocd, o);
  return out;
}

/* ── Animate 原生位图 dat 格式（逆向自 Animate 20.0 保存的合法 FLA，26 个样本全量验证） ──
   DOMBitmapItem 的 bitmapDataHRef 指向 bin/*.dat，Animate 从 dat 读取实际位图数据；
   dat ≠ PNG，布局为：32B 头 + raw deflate(预乘BGRA) + adler32(大端) + 0000。
   若把 PNG 原样塞进 dat，Animate 解析失败 → 位图全部打不开（这正是"只选 am 全炸"的根因）。
   头部字段（小端）：[0]=03 [1]=05 [2:4]=W*4 [4:6]=W [6:8]=H [12:16]=W*20(twips)
                     [20:24]=H*20(twips) [24:28]=01 01 02 00 [28:30]=78 01 [30:32]=deflate长+4 */
function adler32(bytes){
  let a = 1, b = 0;
  for (let i = 0; i < bytes.length; i++){ a = (a + bytes[i]) % 65521; b = (b + a) % 65521; }
  return ((b << 16) | a) >>> 0;
}
async function inflateZlibBytes(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
/* 纯 JS PNG 解码（8bit/非隔行，支持 RGBA/RGB/灰度/灰度+alpha/调色板），返回非预乘 RGBA */
async function decodePngRgba(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (dv.getUint32(0) !== 0x89504E47) throw new Error('非 PNG 数据');
  let pos = 8, W = 0, H = 0, depth = 8, ctype = 6, interlace = 0, plte = null, trns = null;
  const idat = [];
  while (pos + 8 <= bytes.length){
    const len = dv.getUint32(pos);
    const type = String.fromCharCode(bytes[pos+4], bytes[pos+5], bytes[pos+6], bytes[pos+7]);
    const data = bytes.subarray(pos + 8, pos + 8 + len);

	  if (f.kind === 'blur') blur = Math.max(blur, Math.max(f.bx||0, f.by||0));
	  else if (f.kind === 'glow') glow = f;
	  else if (f.kind === 'shadow') shadow = f;

	const glowR = glow ? (glow.bx||0) * FXTUNE.glowBlurK : 0;
	let pad = blur*3 + 4;
	if (glow) pad = Math.max(pad, glowR*3 + 4);
	if (shadow) pad = Math.max(pad, Math.abs(shadow.dist||0) + (shadow.bx||0)*3 + 4);
	pad = Math.min(pad, Math.max(view, 512));
	const pxPerLocal = base.width / view;
	const padPx = Math.ceil(pad * pxPerLocal);

	if (fxElem.alpha !== 1) c.globalAlpha = fxElem.alpha;

	if (blur > 0) parts.push(`blur(${(blur*pxPerLocal).toFixed(2)}px)`);
	if (fxElem.brightness) parts.push(`brightness(${(1+fxElem.brightness).toFixed(3)})`);
	c.filter = parts.length ? parts.join(' ') : 'none';
	if (glow){
	  c.shadowColor = rgbaStr(glow.color, Math.min(1, (glow.alpha!=null?glow.alpha:1)*Math.max(1,glow.strength)*FXTUNE.glowAlphaK));
	  c.shadowBlur = Math.max(1, glowR*pxPerLocal);
	} else if (shadow){
	  c.shadowColor = rgbaStr(shadow.color, Math.min(1, (shadow.alpha!=null?shadow.alpha:1)*Math.max(1,shadow.strength)));
	  c.shadowBlur = Math.max(1, (shadow.bx||0)*pxPerLocal);

	  c.shadowOffsetY = Math.sin(a) * (shadow.dist||0) * pxPerLocal;
	}
	c.drawImage(base, padPx, padPx);
	const fn = `fx_${safeName(name)}_${sha1Hex(enc.encode(key)).slice(0,10)}.png`;
	this.pngs.set(fn, canvasPng(cv));
	const k = w / base.width;
	const val = { png: fn, hw: hw*k, hh: hh*k };
	this.fxPng.set(key, val);
	return { png: fn, cx, cy, hw: val.hw, hh: val.hh };

  /* 一个元件实例最终使用的素材图(含滤镜烘焙) */
  _elemPng(elem, inner){
	const name = elem.libName;
	const sym = this.doc.symbols.get(name);
	if (!sym || !sym.timeline) return null;
	if (sym.duration > 1){
	  const png = this.framePng.get(name + '|' + inner) || this.symPng.get(name);
	  if (!png) return null;
	  const [hw, hh] = this.symHalf.get(name) || [1,1];
	  return { png, hw, hh };
	}
	const m = this._symMeta(name, elem);
	return m ? { png: m.png, hw: m.hw, hh: m.hh } : null;
  }
  _shapeOf(elem){
	const sym = this.doc.symbols.get(elem.libName);
	const [cx, cy] = this.symCenter.get(elem.libName) || [0,0];
	const [hw, hh] = this.symHalf.get(elem.libName) || [1,1];
	const p = matApply(elem.mat, cx, cy);
	const [rot, sx, sy, kx, ky] = trsFromFineDecompose(elem.mat);
	return { px:p[0], py:p[1], rot: rot*180/Math.PI, sx, sy, kx, ky, hw, hh };
  }
  _kfFromElem(elem, tAbs, t0){
	const s = this._shapeOf(elem);
	return { t: tAbs, loc:[s.px,s.py], scl:[s.sx,s.sy], rot:s.rot, skew:[s.kx,s.ky], ease:null };
  }
  build(){
	const doc = this.doc, main = doc.main;
	if (!main) throw new Error('FLA 主时间线缺失');
	const fps = doc.fps, totalFrames = timelineFrames(main);
	const totalMs = totalFrames / fps * 1000;
	const shapes = [];
	const n = main.layers.length;
	for (let i=0;i<n;i++){
	  const layer = main.layers[n-1-i];
	  if (!layer.visible || layer.layerType === 'guide' || layer.layerType === 'folder') continue;
	  if (!layer.frames.some(f => f.elements.length)) continue;
	  for (const s of this.buildLayer(layer, totalFrames, fps, totalMs)) shapes.push(s);
	}

  buildLayer(layer, totalFrames, fps, totalMs){
	const keyFrames = layer.frames.filter(f => f.elements.length).sort((a,b)=>a.index-b.index);
	if (!keyFrames.length) return [];
	const visFrame0 = keyFrames[0].index;
	const lastKf = keyFrames[keyFrames.length-1];
	const visFrame1 = lastKf.index + Math.max(1, lastKf.duration);
	const visT0 = visFrame0 / fps * 1000;
	const visT1 = Math.min(totalMs, visFrame1 / fps * 1000);
	/* 含位图实例的图层（逆向转换产物）单独走位图路径 */
	if (keyFrames.some(f => f.elements.some(e => e.bitmap)))
	  return this._bitmapLayer(layer, keyFrames, fps, visT0, visT1);
	let allStatic = true;
	for (const f of keyFrames){
	  for (const e of f.elements){
		if (!e.isSymbol){ allStatic = false; break; }
		const sym = this.doc.symbols.get(e.libName);
		if (!sym || sym.duration > 1){ allStatic = false; break; }
	  }
	  if (!allStatic) break;
	}
	if (allStatic && keyFrames.length === 1) return this._oneShapeFromFrame(layer, keyFrames[0], visT0, visT1, fps);
	if (allStatic && keyFrames.length > 1) return this._oneShapeKeyframed(layer, keyFrames, visT0, visT1, fps);
	return this._slicedShapes(layer, keyFrames, totalFrames, fps, visT0, visT1);

  _oneShapeFromFrame(layer, f, t0, t1, fps){
	const outs = [];
	for (const e of f.elements){
	  if (e.isSymbol){
		const m = this._symMeta(e.libName, e);
		if (!m) continue;
		const s = this._shapeOf(e);
		outs.push({ label: layer.name, png: m.png, startMs: t0, endMs: t1, halfW: m.hw, halfH: m.hh,
					kfs: [{ t:0, loc:[s.px,s.py], scl:[s.sx,s.sy], rot:s.rot, skew:[s.kx,s.ky], ease:null }] });
	  } else if (e.shape){
		const rr = this._rasterShapeToPng(e.shape, 'shape_' + (outs.length));
		if (!rr) continue;
		const p = matApply(e.mat, rr.cx, rr.cy);
		const [rot, sx, sy, kx, ky] = trsFromFineDecompose(e.mat);
		outs.push({ label: layer.name, png: rr.fn, startMs: t0, endMs: t1, halfW: rr.half, halfH: rr.half,
					kfs: [{ t:0, loc:[p[0],p[1]], scl:[sx,sy], rot: rot*180/Math.PI, skew:[kx,ky], ease:null }] });
	  }
	}
	return outs;
  }
  _oneShapeKeyframed(layer, keyFrames, visT0, visT1, fps){
	/* 分组键含"滤镜签名": 同一元件在不同关键帧上滤镜/透明度可能不同
	   (如火花 元件 1: 首帧 alpha=0.6 淡入 + 后续帧 alpha=1), 需拆成独立素材。 */
	const groups = new Map();
	for (const f of keyFrames){
	  for (const e of f.elements){
		let g = groups.get(e.libName);
		if (!g) g = groups.set(e.libName, new Map()).get(e.libName);
		const fk = this._fxKey(e);
		if (!g.has(fk)) g.set(fk, { fx: e, frames: [] });
		g.get(fk).frames.push(f);
	  }
	}
	const outs = [];
	for (const [name, byFx] of groups){
	  for (const [fk, g] of byFx){
		const m = this._symMeta(name, g.fx);
		if (!m) continue;
		g.frames.sort((a,b)=>a.index-b.index);
		const frFirst = Math.round(visT0/1000*fps);
		const frLast = Math.max(frFirst, Math.round(visT1/1000*fps) - 1);
		outs.push({ label: layer.name, png: m.png, startMs: visT0, endMs: visT1, halfW: m.hw, halfH: m.hh,
					kfs: this._sampledKfs(layer, frFirst, frLast, name, m.cx, m.cy, fps, fk) });

	}

  _sampledKfs(layer, frFirst, frLast, name, cx, cy, fps, fxKey){
	const samples = [];
	for (let fr=frFirst; fr<=frLast; fr++){
	  let mat = null;
	  for (const [e, m] of layerItemsAt(layer, fr)){
		if (e.isSymbol && (!name || e.libName === name) && this._fxKey(e) === (fxKey || '')){ mat = m; break; }
	  }
	  if (!mat){ samples.push({ t: fr/fps*1000, kf: null }); continue; }
	  const p = matApply(mat, cx, cy);
	  const [rot, sx, sy, kx, ky] = trsFromFineDecompose(mat);
	  samples.push({ t: fr/fps*1000, kf: { t: fr/fps*1000, loc:[p[0],p[1]], scl:[sx,sy], rot: rot*180/Math.PI, skew:[kx,ky], ease:null } });
	}
	return collapseSamples(samples) || [];

  /* ── 动画符号层的拆解 ─────────────────────────────────────────────────
	 [核心] 主时间线上排着若干「标签符号」实例(label/idle、label/walk…)。
	 标签符号内部是「一层一个部件 sprite」的结构, 每个部件在自己的关键帧上
	 逐帧改变 loc/rot/scl。正确产物是:
		每个部件 = 一条 shape, 从头到尾连续存在, shape 内部用关键帧驱动
		位置/旋转/缩放 —— 而不是把整只僵尸逐帧烘焙成一张张全幅大图。

  _slicedShapes(layer, keyFrames, totalFrames, fps, visT0, visT1){

	  for (const el of f.elements){

		const sym = this.doc.symbols.get(el.libName);
		if (!sym || !sym.timeline){ continue; }
		const symDur = Math.max(1, sym.duration);
		let emitted = 0;
		/* XFL 的 DOMLayer 顺序是"最上层在前", AMPROJ 的 shape 顺序是"先写先垫底",
		   因此必须反序遍历, 否则部件前后遮挡整个翻过来。 */
		const innerLayers = sym.timeline.layers;
		for (let li=innerLayers.length-1; li>=0; li--){
		  const inner = innerLayers[li];
		  if (!inner.visible || inner.layerType === 'guide' || inner.layerType === 'folder') continue;
		  const partNames = [];
		  for (const g of inner.frames) for (const e of g.elements){
			if (e.bitmap) continue;
			if (e.isSymbol && partNames.indexOf(e.libName) < 0) partNames.push(e.libName);
		  }
		  for (const partName of partNames){
			const partSym = this.doc.symbols.get(partName);
			if (!partSym || !partSym.timeline) continue;
			/* 部件自身还是逐帧动画 -> 交回逐帧路径(本工程无此情况, 仅为保险) */
			if (partSym.duration > 1){ continue; }
			const m = this._symMeta(partName, el);
			if (!m) continue;
			const samples = [];
			for (let k=0; k<instDur; k++){
			  const fr = frStart + k;
			  const inF = k % symDur;
			  const hit = layerItemsAt(inner, inF).find(([e]) => e.libName === partName);
			  if (!hit){ samples.push({ t: fr/fps*1000, kf: null }); continue; }
			  /* 部件局部 -> 舞台: 外层实例矩阵 ∘ 部件矩阵 */
			  const mat = matMul(el.mat, hit[0].mat);
			  const p = matApply(mat, m.cx, m.cy);
			  const [rot, sx, sy, kx, ky] = trsFromFineDecompose(mat);
			  samples.push({ t: fr/fps*1000,
				kf:{ t: fr/fps*1000, loc:[p[0],p[1]], scl:[sx,sy], rot: rot*180/Math.PI, skew:[kx,ky], ease:null } });
			}
			const kfs = collapseSamples(samples);
			if (!kfs || !kfs.length) continue;
			outs.push({ label: partName.split('/').pop(), png: m.png,
						startMs: samples[0].t, endMs: samples[samples.length-1].t + 1000/fps,
						halfW: m.hw, halfH: m.hh, kfs });
			emitted++;
		  }
		}
		/* 保底：符号内部拆不出部件(如纯矢量补间层), 维持整体逐帧光栅化 */
		if (!emitted) for (const o of this._bakeSymbolRuns(el, sym, frStart, instDur, fps)) outs.push(o);
	  }
	}
	return outs;
  }
  _bakeSymbolRuns(el, sym, frStart, instDur, fps){
	if (sym.duration > 1) this.buildSymbolFrames(el.libName, sym);
	else this.buildSymbolPng(el.libName);
	const seq = [];
	for (let k=0; k<instDur; k++){
	  const fr = frStart + k, inner = k % Math.max(1, sym.duration);
	  const r = this._elemPng(el, inner);
	  if (!r) continue;
	  seq.push({ png: r.png, hw: r.hw, hh: r.hh, fr, mat: el.mat });
	}
	const outs = [];
	let i = 0;
	while (i < seq.length){
	  let j = i;
	  while (j+1 < seq.length && seq[j+1].png === seq[i].png && seq[j+1].fr === seq[j].fr + 1) j++;
	  const [cx, cy] = this.symCenter.get(el.libName) || [0,0];
	  const t0 = seq[i].fr/fps*1000, t1 = (seq[j].fr+1)/fps*1000;
	  const so = { label: el.libName.split('/').pop(), png: seq[i].png, startMs: t0, endMs: t1,
				   halfW: seq[i].hw, halfH: seq[i].hh, kfs: [] };
	  for (const it of [seq[i], seq[j]]){
		const p = matApply(it.mat, cx, cy);
		const [rot, sx, sy, kx, ky] = trsFromFineDecompose(it.mat);
		so.kfs.push({ t: it.fr/fps*1000, loc:[p[0],p[1]], scl:[sx,sy], rot: rot*180/Math.PI, skew:[kx,ky], ease:null });
	  }
	  outs.push(so);
	  i = j + 1;
	}

  }
  _rasterShapeToPng(shape, tag){
	const rr = rasterizeShape(shape, 1, 2048);
	if (!rr) return null;
	const cx = rr.minX + rr.w*0.5, cy = rr.minY + rr.h*0.5;
	let half = Math.max(rr.w, rr.h)*0.5 + 1;

	return { fn, cx, cy, half };

  writeAmproj(title){
	const doc = this.doc, main = doc.main;
	const totalFrames = timelineFrames(main);
	const totalMs = totalFrames / doc.fps * 1000;
	const { shapes } = this.build();
	const W = doc.width, H = doc.height;
	const used = new Set(shapes.map(s => s.png));
	const pngs = new Map();
	for (const [k,v] of this.pngs) if (used.has(k)) pngs.set(k, v);
	const L = [];
	L.push("<?xml version='1.0' encoding='UTF-8' ?>");
	L.push('<!-- 由 FLA⇄AMPROJ 网页转换器 从 Adobe Animate 工程转换而来 -->');
	L.push(`<scene title="${esc(title || 'converted')}" width="${W}" height="${H}" exportWidth="${W}" exportHeight="${H}" precompose="dynamicResolution" bgcolor="${doc.bg}" totalTime="${Math.round(totalMs)}" fps="${doc.fps}" retime="freeze" retimeAdaptFPS="false">`);
	for (const fn of [...pngs.keys()].sort()){
	  const data = pngs.get(fn);
	  const sig = sha1Hex(data);
	  const [iw, ih] = pngSize(data);
	  L.push(`  <media uri="amproj:${fn}" filename="${esc(fn)}" title="${esc(fn)}" type="image/png" duration="0" size="${data.length}" sig="${sig}" orientation="0" width="${iw}" height="${ih}" />`);
	}
	let sid = 100;
	for (const s of shapes){
	  sid++;
	  const t0 = Math.floor(s.startMs + 1e-6);
	  let t1 = Math.floor(s.endMs - 1e-6);
	  if (t1 <= t0) t1 = t0 + 1;
	  L.push(`  <shape id="${sid}" label="${esc(s.label)}" startTime="${t0}" endTime="${t1}" fillType="media" fillImage="amproj:${esc(s.png)}" mediaFillMode="fill" s=".rect">`);
	  L.push('    <transform lockAspectRatio="false">');
	  const span = Math.max(1, s.endMs - s.startMs);
	  const kfs = s.kfs.slice().sort((a,b)=>a.t-b.t);
	  const tn = t => (t - s.startMs) / span;
	  const ea = e => e ? ` e="cubicBezier ${fmt(e[0])} ${fmt(e[1])} ${fmt(e[2])} ${fmt(e[3])}"` : '';
	  L.push('      <location>');
	  for (const k of kfs) L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(k.loc[0])},${fmt(k.loc[1])},0.000000"${ea(k.ease)} />`);
	  L.push('      </location>');
	  L.push('      <scale>');
	  for (const k of kfs) L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(k.scl[0])},${fmt(k.scl[1])}"${ea(k.ease)} />`);
	  L.push('      </scale>');
	  L.push('      <rotation>');
	  let prev = null;
	  for (const k of kfs){
		let v = k.rot;
		if (prev !== null){
		  while (v - prev > 180) v -= 360;
		  while (v - prev < -180) v += 360;
		}
		prev = v;
		L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(v)}"${ea(k.ease)} />`);
	  }
	  L.push('      </rotation>');
	  if (kfs.some(k => Math.abs(k.skew[0]) > 1e-7 || Math.abs(k.skew[1]) > 1e-7)){
		L.push('      <skew>');
		for (const k of kfs) L.push(`        <kf t="${fmt(tn(k.t))}" v="${fmt(k.skew[0])},${fmt(k.skew[1])}" />`);
		L.push('      </skew>');
	  }
	  L.push('    </transform>');
	  L.push(`    <property name="size" type="vec2" value="${fmt(s.halfW)},${fmt(s.halfH)}" />`);
	  L.push('  </shape>');
	}
	L.push('</scene>');
	const xmlText = L.join('\n') + '\n';
	const xmlName = 'converted-from-fla.xml';
	const manifest = [...pngs.keys()].sort().map(fn => `${sha1Hex(pngs.get(fn))}:${fn}`).join('\n');
	const entries = [];
	for (const fn of [...pngs.keys()].sort()) entries.push({ name: fn, data: pngs.get(fn) });
	entries.push({ name: xmlName, data: enc.encode(xmlText) });
	entries.push({ name: 'manifest.txt', data: enc.encode(manifest) });
	return { bytes: zipStore(entries), xml: xmlText, shapes, totalFrames, totalMs, pngCount: pngs.size, W, H };
  }
}

function cubicBezierY(u, p){
  const x1=p[0], y1=p[1], x2=p[2], y2=p[3];
  const cx = 3*x1, bx = 3*(x2-x1)-cx, ax = 1-cx-bx;
  const cy = 3*y1, by = 3*(y2-y1)-cy, ay = 1-cy-by;
  let t = u;
  for (let i=0;i<8;i++){
	const x = ((ax*t + bx)*t + cx)*t - u;
	if (Math.abs(x) < 1e-6) break;
	const d = (3*ax*t + 2*bx)*t + cx;
	if (Math.abs(d) < 1e-6) break;
	t = Math.min(1, Math.max(0, t - x/d));
  }
  return ((ay*t + by)*t + cy)*t;
}
function parseTrack(parent, name){
  const el = ch(parent, name);
  const kfs = [];
  if (el) for (const kf of chs(el, 'kf')){
	const v = at(kf,'v','').split(',').map(s => parseFloat(s));
	const eStr = at(kf,'e','');
	let ease = null;
	if (eStr.indexOf('cubicBezier') === 0){
	  const p = eStr.trim().split(/\s+/).slice(1).map(Number);
	  if (p.length >= 4 && p.every(x => isFinite(x))) ease = p.slice(0,4);
	}
	kfs.push({ t: atF(kf,'t',0), v, ease });
  }
  /* [坑8 · 静态轨道] AM 的变换轨道支持「元素级静态值」写法:
	 <scale value="0.184862,0.184862"/>（无任何 kf 子元素）。
	 旧实现只读 kf 子元素, 静态轨道被当成默认值(缩放1/旋转0),
	 导致带静态缩放的素材(如双枪 0.1849 / 0.32)按 1.0 渲染 —— 元件放大 3~5 倍,
	 且该异常随 AM→FLA→AM 往返一直保留。 */
  if (el && !kfs.length){
	const sv = at(el, 'value', '');
	if (sv !== '') kfs.push({ t: 0, v: sv.split(',').map(s => parseFloat(s)), ease: null });
  }
  kfs.sort((a,b) => a.t - b.t);
  return { kfs };
}
function trackAt(track, u, def){
  const kfs = track.kfs;

  if (u <= kfs[0].t) return kfs[0].v.slice();
  const last = kfs[kfs.length-1];
  if (u >= last.t) return last.v.slice();

	t.dat = 'B ' + (++binN) + ' 1790728191.dat';
	D.push(`          <DOMBitmapItem name="media/${t.base}" itemID="${xflItemId()}" sourceLastImported="0" externalFileSize="${t.bytes.length}" originalCompressionType="lossless" href="media/${t.base}.png" bitmapDataHRef="${t.dat}" frameRight="${R(t.w*20)}" frameBottom="${R(t.h*20)}" maxScaleUsed="1"/>`);
  }
  D.push('     </media>');
  D.push('     <symbols>');
  for (const t of texs.values())
	D.push(`          <Include href="image/${t.base}.xml" itemIcon="1" loadImmediate="false" itemID="${xflItemId()}"/>`);
  for (const t of texs.values())
	D.push(`          <Include href="${esc(sprOf.get([...texs.keys()].find(k => texs.get(k) === t)))}.xml" itemIcon="1" loadImmediate="false" itemID="${xflItemId()}"/>`);
  for (const lab of labels)
	D.push(`          <Include href="label/${esc(lab.name)}.xml" itemIcon="1" loadImmediate="false" itemID="${xflItemId()}"/>`);
  D.push('     </symbols>');
  D.push('     <timelines>');
  D.push('          <DOMTimeline name="animation">');
  D.push('               <layers>');
  /* label 层 */
  D.push('                    <DOMLayer name="label" color="#4F4FFF" current="true" isSelected="true" heightLiteral="24">');
  D.push('                         <frames>');
  for (const lab of labels){
	D.push(`                              <DOMFrame index="${lab.f0}" duration="${lab.f1 - lab.f0 + 1}" name="${esc(lab.name)}" labelType="name" keyMode="9728">`);
	D.push('                                   <elements/>');
	D.push('                              </DOMFrame>');
  }
  D.push('                         </frames>');
  D.push('                    </DOMLayer>');
  /* action 层：每个 label 末帧 stop() */
  D.push('                    <DOMLayer name="action" color="#4F4FFF" heightLiteral="24">');
  D.push('                         <frames>');
  for (const lab of labels){
	if (lab.f1 > lab.f0){
	  D.push(`                              <DOMFrame index="${lab.f0}" duration="${lab.f1 - lab.f0}" keyMode="9728">`);
	  D.push('                                   <elements/>');
	  D.push('                              </DOMFrame>');
	}
	D.push(`                              <DOMFrame index="${lab.f1}" keyMode="9728">`);
	D.push('                                        <' + 'Actionscript>');
	D.push('                                          <' + 'script><![CDATA[stop();]]><' + '/script>');
	D.push('                                        <' + '/Actionscript>');
	D.push('                                   <elements/>');
	D.push('                              </DOMFrame>');
  }
  D.push('                         </frames>');
  D.push('                    </DOMLayer>');
  /* instance 层 */
  D.push('                    <DOMLayer name="instance" color="#4F4FFF" heightLiteral="24">');
  D.push('                         <frames>');
  for (const lab of labels){
	D.push(`                              <DOMFrame index="${lab.f0}" duration="${lab.f1 - lab.f0 + 1}" keyMode="9728">`);
	D.push('                                   <elements>');
	D.push(`                                        <DOMSymbolInstance libraryItemName="label/${esc(lab.name)}" symbolType="graphic" loop="loop"/>`);
	D.push('                                   </elements>');
	D.push('                              </DOMFrame>');
  }
  D.push('                         </frames>');
  D.push('                    </DOMLayer>');
  D.push('               </layers>');
  D.push('          </DOMTimeline>');
  D.push('     </timelines>');
  D.push('     <scripts/>');
  D.push('     <PrinterSettings/>');
  D.push('     <publishHistory/>');
  D.push('</DOMDocument>');
  const domXml = D.join('\n') + '\n';

  /* ── 8 · 打包（DOMDocument.xml 紧随 mimetype 且 deflate 压缩） ── */
  const entries = [];
  const pushStore = (name, data) => entries.push({ name, data, crc: crc32(data), usize: data.length, deflate: false });
  const pushDefl  = async (name, raw) => entries.push({ name, data: await deflateRawBytes(raw), crc: crc32(raw), usize: raw.length, deflate: true });
  pushStore('mimetype', enc.encode('application/vnd.adobe.xfl'));
  pushStore('ZOMBIE_TUTORIAL_IMP.xfl', enc.encode('PROXY-CS5'));
  await pushDefl('DOMDocument.xml', enc.encode(domXml));
  pushStore('META-INF/', XFL_EMPTY);
  pushStore('META-INF/metadata.xml', XFL_EMPTY);
  await pushDefl('PublishSettings.xml', enc.encode(
`<?xml version="1.0" encoding="UTF-8"?>
<PublishSettings xmlns="http://ns.adobe.com/xfl/2008/">
  <PublishFormatProperties includedClasses="preloader" width="${W}" height="${H}" matchMovieDim="true" />
  <PublishHtmlProperties enabled="1" />
</PublishSettings>
`));
  pushStore('MobileSettings.xml', XFL_EMPTY);
  for (const d of ['publishtemplates/', 'LIBRARY/', 'LIBRARY/image/', 'LIBRARY/label/', 'LIBRARY/media/', 'LIBRARY/sprite/'])
	pushStore(d, XFL_EMPTY);
  const imgs = [...texs.values()];
  for (const t of imgs) await pushDefl(`LIBRARY/image/${t.base}.xml`, enc.encode(xflImageSymbol('image/' + t.base, 'media/' + t.base)));
  for (const k of texs.keys()) await pushDefl(`LIBRARY/${sprOf.get(k)}.xml`, enc.encode(xflSpriteSymbol(sprOf.get(k), 'image/' + texs.get(k).base)));
  for (const lab of labels) await pushDefl(`LIBRARY/label/${lab.name}.xml`, enc.encode(xflLabelSymbol('label/' + lab.name, lab.name, lab.parts, lab.f0, lab.f1)));
  for (const t of imgs){
	pushStore(`LIBRARY/media/${t.base}.png`, t.bytes);
	pushStore('bin/' + t.dat, t.datBytes);
  }
  return { bytes: zipWrite(entries), xml: domXml, layers: labels.length, media: texs.size,
		   totalFrames: L, W, H, fps };
}

const baseName = n => n.replace(/\.(fla|xfl|amproj|zip)$/i, '');
/* 【格式污染根因】原版 res.json 的 id / path 里不能出现非 ASCII 字符。

const idName = s => {

function kv(k, v){ return '<div class="kv"><span>' + esc(k) + '</span><span>' + esc(String(v)) + '</span></div>'; }

function drawSide(ctx, side, frameIdx){
  const st = PV;
  const tMs = frameIdx / st.fps * 1000;
  const bg = (side === 'A') ? st.bgA : st.bgB;
  if (bg){ ctx.fillStyle = bg; ctx.fillRect(0, 0, st.W, st.H); }
  if (side === 'A'){
	if (st.mode === 'fla2am') renderTimeline(ctx, st.doc.main, frameIdx, st.doc, 0);
	else renderAmFrame(ctx, st.model, tMs);
  } else {
	if (st.mode === 'fla2am') renderAmFrame(ctx, st.model, tMs);
	else renderTimeline(ctx, st.doc.main, frameIdx, st.doc, 0);
  }
}
function putScaled(dst, src){
  const ctx = dst.getContext('2d');
  ctx.clearRect(0, 0, dst.width, dst.height);
  const s = Math.min(dst.width/src.width, dst.height/src.height);
  const dw = src.width*s, dh = src.height*s;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, (dst.width-dw)/2, (dst.height-dh)/2, dw, dh);
}
function diffCanvases(a, b){
  const ca = a.getContext('2d').getImageData(0, 0, a.width, a.height);
  const cb = b.getContext('2d').getImageData(0, 0, b.width, b.height);
  const out = newCanvas(a.width, a.height);
  const oc = out.getContext('2d'), od = oc.createImageData(a.width, a.height);
  let bad = 0;
  for (let i=0;i<ca.data.length;i+=4){
	const d = Math.max(Math.abs(ca.data[i]-cb.data[i]), Math.abs(ca.data[i+1]-cb.data[i+1]),
					   Math.abs(ca.data[i+2]-cb.data[i+2]), Math.abs(ca.data[i+3]-cb.data[i+3]));
	if (d > 40){ bad++; od.data[i]=255; od.data[i+1]=70; od.data[i+2]=70; od.data[i+3]=255; }
	else { od.data[i+3]=0; }
  }
  oc.putImageData(od, 0, 0);
  return { canvas: out, pct: 100*bad/(a.width*a.height) };
}
function paintPreview(idx){
  if (!PV) return;
  idx = Math.max(0, Math.min(idx, PV.totalFrames - 1));
  $('frame').value = String(idx);
  $('frameLbl').textContent = '帧 ' + idx + ' / ' + (PV.totalFrames - 1)
	+ '  (' + (idx/PV.fps*1000).toFixed(0) + 'ms)';
  const offA = newCanvas(PV.W, PV.H), offB = newCanvas(PV.W, PV.H);
  drawSide(offA.getContext('2d'), 'A', idx);
  drawSide(offB.getContext('2d'), 'B', idx);
  putScaled($('cvA'), offA); putScaled($('cvB'), offB);
  const d = diffCanvases(offA, offB);
  putScaled($('cvD'), d.canvas);
  $('tD').textContent = '差异（红=不一致像素，' + d.pct.toFixed(2) + '%）';
}
$('frame').oninput = () => paintPreview(parseInt($('frame').value, 10));
$('playBtn').onclick = () => {
  PLAYING = !PLAYING;
  $('playBtn').textContent = PLAYING ? '⏸' : '▶';
  const step = () => {
	if (!PLAYING || !PV) return;
	let f = parseInt($('frame').value, 10) + 1;
	if (f >= PV.totalFrames) f = 0;
	paintPreview(f);
	setTimeout(step, 1000/PV.fps);
  };
  if (PLAYING) step();
};

/* 往返自测：源 →(A)→ 中间 →(B)→ 回到源格式，逐帧比对 */
async function selfTest(){
  if (!SRC) return;
  logClear();
  log('往返自测开始…', 'ok');
  const files = await unzip(SRC.bytes);
  const sampleFrames = 12;
  if (MODE === 'fla2am'){
	const doc0 = loadDoc(files); if (doc0.bitmapItems.size) await decodeFlaBitmaps(doc0);
	const conv = new Fla2Am(doc0, 2, { doFilters: $('doFilters').checked });
	const r1 = conv.writeAmproj(baseName(SRC.name));
	const files1 = await unzip(r1.bytes);
	const model = parseAmproj(files1); await decodeAmTextures(model);
	const r2 = await am2fla(model);
	const files2 = await unzip(r2.bytes);
	const doc1 = loadDoc(files2); await decodeFlaBitmaps(doc1);
	const fps = doc0.fps, total = timelineFrames(doc0.main);
	const errs = compareFla(doc0, doc1, fps, total, sampleFrames);
	report(errs, 'FLA→AM→FLA');
  } else {
	const model0 = parseAmproj(files); await decodeAmTextures(model0);
	const r1 = await am2fla(model0);
	const files1 = await unzip(r1.bytes);
	const doc = loadDoc(files1); await decodeFlaBitmaps(doc);
	const conv = new Fla2Am(doc, 2);
	const r2 = conv.writeAmproj(baseName(SRC.name));
	const files2 = await unzip(r2.bytes);
	const model1 = parseAmproj(files2); await decodeAmTextures(model1);
	const fps = model0.fps, total = Math.max(1, Math.round(model0.totalTime/1000*fps));
	const errs = compareAm(model0, model1, fps, total, sampleFrames);
	report(errs, 'AM→FLA→AM');
  }
}
function report(errs, label){
  const avg = errs.reduce((s,e)=>s+e.pct,0)/Math.max(1,errs.length);
  const worst = errs.reduce((a,b)=>b.pct>a.pct?b:a, errs[0] || {pct:0});
  log('往返 ' + label + '：采样 ' + errs.length + ' 帧', 'ok');
  log('  平均不一致率 ' + avg.toFixed(2) + '%，最差 ' + worst.pct.toFixed(2)
	  + '% @帧' + worst.frame, avg < 2 ? 'ok' : 'w');
  /* ★ 三件套 ⇄ AM 这类往返，差异来自**两处性质完全不同**的环节：
	   ① 动画数据（元件/矩阵/label）—— 我们的目标，必须几乎为 0；
	   ② 图集像素（PNG → AM 光栅 → PNG）—— 往返回必然重新光栅化，
		  原版图集密度是 res/1200≈1.29 而 AM 光栅只有逻辑分辨率，
		  重采样必然带来几个百分点的边缘差异，这是格式本身的损失，不是 bug。
	 判据：平均 < 8% 且非爆炸式（< 20%）即视为「动画数据一致、仅存在重采样差异」。 */
  if (avg < 2)
	log('  ✓ 往返后图形高度一致（动画数据与图集均对齐）', 'ok');
  else if (avg < 8)
	log('  ✓ 动画数据一致（元件/矩阵/label 完全对齐）；剩余 '
		+ avg.toFixed(1) + '% 为图集重采样差异 —— PNG → AM 光栅 → PNG 必然损失，属格式固有', 'ok');
  else if (avg < 20)
	log('  ⚠ 存在可见偏差，建议检查素材或 label 划分', 'w');
  else
	log('  ✗ 偏差过大，请检查输入是否完整（三件套需 png + res.json + PAM.am.json）', 'e');

function compareFla(docA, docB, fps, total, n){
  const errs = [];
  for (let i=0;i<n;i++){
	const fr = Math.round(i * (total-1) / Math.max(1, n-1));
	const a = newCanvas(docA.width, docA.height), b = newCanvas(docB.width, docB.height);
	const ca = a.getContext('2d'), cb = b.getContext('2d');
	ca.fillStyle = docA.bg; ca.fillRect(0,0,a.width,a.height);
	cb.fillStyle = docB.bg; cb.fillRect(0,0,b.width,b.height);
	renderTimeline(ca, docA.main, fr, docA, 0);
	renderTimeline(cb, docB.main, fr, docB, 0);
	errs.push({ frame: fr, pct: diffCanvases(a, b).pct });
  }
  return errs;
}
function compareAm(modelA, modelB, fps, total, n){
  const errs = [];
  for (let i=0;i<n;i++){
	const fr = Math.round(i * (total-1) / Math.max(1, n-1));
	const tms = fr/fps*1000;
	const a = newCanvas(modelA.width, modelA.height), b = newCanvas(modelB.width, modelB.height);
	const ca = a.getContext('2d'), cb = b.getContext('2d');
	ca.fillStyle = modelA.bgcolor; ca.fillRect(0,0,a.width,a.height);
	cb.fillStyle = modelB.bgcolor; cb.fillRect(0,0,b.width,b.height);
	renderAmFrame(ca, modelA, tms);
	renderAmFrame(cb, modelB, tms);
	errs.push({ frame: fr, pct: diffCanvases(a, b).pct });
  }
  return errs;
}
/* ══════════════════════════════════════════════════════════════════════════
   11 · 原版三件套 ⇄ AMPROJ
   ──────────────────────────────────────────────────────────────────────────
   三件套 = PNG 图集 + *.res.json(图集子图表) + *.PAM.am.json(PopAnimInfo)
   严格遵循 PopStudio:
	 PopAnimInfo.cs / SpriteInfo.cs / FrameInfo.cs / ImageInfo.cs / PamXfl.cs
   核心语义:
	 image[i]  = 图集里的一张子图(逻辑名 | 资源ID)，res.json 给原图坐标 ax,ay,aw,ah
	 sprite[i] = 由 image/子 sprite 拼成的子动画(这里实测均为 1 帧)
	 main_sprite.frame[f] = 第 f 帧；append=新建持久元件(即一个图层)，
							remove=删除，change=该帧变换
	 ★ 一个元件(index)在存活期内是所有帧共用的同一图层，逐帧由 change 驱动。
   ══════════════════════════════════════════════════════════════════════════ */

/* 原版图集按 res 缩放：图集实际像素 = 逻辑尺寸 × (res/1200)。
   实测 1536 组 → 系数 1.28（=1536/1200），与 PopStudio k_standard_resolution=1200 一致。 */
const PAM_STD_RESOLUTION = 1200;
/* 凭空调用 AM → 三件套（没有备忘录）时的默认 res。原版常见值为 1536。 */
const PAM_DEFAULT_RES = 1536;
/* ★ [坑28a] 原版 PopAnim 的画布恒为 390×390（PVZ2 全系列实测一致）。
   旧实现直接取 amproj 自身的画布（如 test.amproj 的 720×720），导出的
   pam.size 就成了 [720,720]，与原版规范不符。无备忘录时强制回落到 390。 */
const PAM_DEFAULT_SIZE = [390, 390];
/* ★ [坑28b] slot 段位。原版用万级唯一段（实测 atlas=2975、子图 13048~13080），
   旧实现在无备忘录时从 1 / 2 开始 —— 这是游戏资源表的**高危区**，
   注入 PVZ2 几乎必然撞表。这里给一个高位起始段，并按工程名哈希分散。 */
const PAM_SLOT_BASE = 40000;
function slotBaseFor(idb){
  let h = 0; const t = String(idb || 'x');

/* 备忘录文件名（「修改模式」的载体） */
const MEMO_FILE = 'pam_memo.txt';
/* ★ [坑15b · 图集密度] 原版 1536 组图集的子图是「逻辑尺寸 × res/1200 = 1.28」：
   实测 BonkchoyAtlas.json，aw/size 均值 1.287（34×31 的逻辑图在图集里是 44×40）。
   false = 按逻辑分辨率打包（AM 光栅本身只有逻辑分辨率，放大只是插值，往返帧差更小）；
   true  = 与原版逐字段一致（图集放大 1.28，res.json 的 aw/ah 同步放大）。
   ★ 二者必须二选一，不能混：res 字段写 1536 却按 1.0 打包 = 自相矛盾。 */
const PAM_ATLAS_DENSITY_MATCH = false;

/* ── 三件套解析 ── */
function isTripletName(n){ return /\.(am\.json|res\.json|png)$/i.test(n); }
function findEntry(files, re){
  for (const [k,v] of files) { const b = k.split('/').pop(); if (re.test(b)) return { path:k, name:b, bytes:v }; }
  return null;
}
/* 解析 res.json → { map: Map<id, {ax,ay,aw,ah}>, atlas: {width,height}, res: 1536 } */
function parseResJson(text){
  const j = JSON.parse(text);
  const map = new Map();
  let atlas = null;
  for (const r of (j.resources || [])){
	if (r.atlas){ atlas = { width: r.width, height: r.height, id: r.id }; continue; }
	if (r.type === 'Image' && r.id) map.set(r.id, { ax: r.ax|0, ay: r.ay|0, aw: r.aw|0, ah: r.ah|0, path: r.path });
  }
  return { map, atlas, res: parseInt(j.res, 10) || 0, id: j.id || '', parent: j.parent || '', raw: j };
}
/* 解析 .PAM.am.json（PopAnimInfo） */
function parsePamJson(text){
  const d = JSON.parse(text);
  if (!d || !d.image || !d.main_sprite) throw new Error('不是合法的 .PAM.am.json（缺 image / main_sprite）');
  d.version = d.version || 6;
  d.frame_rate = d.frame_rate || 30;
  d.position = d.position || [0, 0];
  d.size = d.size || [390, 390];
  d.sprite = d.sprite || [];
  for (const f of d.main_sprite.frame){
	f.command = f.command || []; f.remove = f.remove || []; f.append = f.append || []; f.change = f.change || [];
  }
  for (const s of d.sprite) for (const f of s.frame){
	f.command = f.command || []; f.remove = f.remove || []; f.append = f.append || []; f.change = f.change || [];
  }
  return d;
}
/* 计算 main_sprite 每个元件(index)的存活区间 [startFrame, endFrame) */
function buildElementLife(pam){
  const life = new Map();   // index -> { start, end, sprite, resource, addTimes:[], alive:Set }
  const frames = pam.main_sprite.frame;
  for (let i=0;i<frames.length;i++){
	for (const a of frames[i].append){
	  if (!life.has(a.index)) life.set(a.index, { index:a.index, start:i, end:frames.length, sprite:!!a.sprite, resource:a.resource|0 });
	}
	for (const r of frames[i].remove){
	  const e = life.get(r.index);
	  if (e && e.end === frames.length) e.end = i;   // remove 帧起不再存在
	}
  }
  return life;
}
/* main_sprite 上的 label 区间：[{name, start, end}]（end 为开区间） */
function pamLabelRanges(pam){
  const frames = pam.main_sprite.frame;
  const marks = [];
  for (let i=0;i<frames.length;i++) if (frames[i].label) marks.push({ name: frames[i].label, start: i });
  const out = [];
  for (let k=0;k<marks.length;k++){
	out.push({ name: marks[k].name, start: marks[k].start, end: (k+1 < marks.length ? marks[k+1].start : frames.length) });
  }
  return out;
}
/* 读取三件套 → { pam, res, atlasBytes, images:[{name,id,logical:[w,h],mat:[a,b,c,d,tx,ty],rect,cvs}] } */
function parseTriplet(files){
  const amE = findEntry(files, /\.PAM\.am\.json$/i) || findEntry(files, /\.am\.json$/i);
  const resE = findEntry(files, /\.res\.json$/i);
  if (!amE) throw new Error('三件套里找不到 *.PAM.am.json');
  const pam = parsePamJson(dec.decode(amE.bytes));
  let res = { map: new Map(), atlas: null, res: 0, raw: null };
  if (resE) res = parseResJson(dec.decode(resE.bytes));
  else log('  未找到 *.res.json，将按逻辑尺寸直接裁切（可能偏差）', 'w');

  /* 找 PNG 图集：优先名字与 res.parent / id 相近的 */
  const pngs = [];
  for (const [k,v] of files){ const b = k.split('/').pop(); if (/\.png$/i.test(b)) pngs.push({ path:k, name:b, bytes:v }); }
  if (!pngs.length) throw new Error('三件套里找不到 PNG 图集');
  const hint = (res.raw && (res.raw.parent || res.raw.id)) || amE.name.replace(/\.PAM\.am\.json$/i, '');
  let atlasBytes = pngs[0].bytes;
  const hit = pngs.find(p => p.name.toLowerCase().indexOf(hint.toLowerCase()) >= 0)
		   || pngs.find(p => hint.toLowerCase().indexOf(p.name.replace(/\.png$/i,'').toLowerCase()) >= 0);
  if (hit) atlasBytes = hit.bytes;
  const [atlasW, atlasH] = pngSize(atlasBytes);
  return { pam, res, atlasBytes, atlasW, atlasH, amName: amE.name };
}
/* 由图集解码并裁出每张 image 的子图。返回 images[]，元素含 canvas 与元数据。
   坐标系原点=子图左上，遵循原版：sprite 的 transform 是「元素坐标系里的矩阵」。 */
async function sliceTripletImages(triplet){
  const { pam, res, atlasBytes, atlasW, atlasH } = triplet;
  let bmp = null;
  try { bmp = await createImageBitmap(new Blob([atlasBytes], { type:'image/png' })); }
  catch(e){ throw new Error('图集 PNG 解码失败: ' + e.message); }
  const resScale = res.res ? (res.res / PAM_STD_RESOLUTION) : 1;  // 1536 → 1.28
  const images = [];
  for (let i=0;i<pam.image.length;i++){
	const im = pam.image[i];
	const nameParts = String(im.name || '').split('|');
	const logical = nameParts[0] || ('image_' + i);
	const rid = nameParts[1] || null;
	const logicalSize = (im.size && im.size.length >= 2) ? [im.size[0], im.size[1]] : [0, 0];
	const mat = (im.transform && im.transform.length >= 6) ? im.transform.slice(0,6) : [1,0,0,1,0,0];
	let rect = null, src = 'res';
	if (rid && res.map.has(rid)){
	  const r = res.map.get(rid);
	  if (r.aw > 0 && r.ah > 0) rect = { x:r.ax, y:r.ay, w:r.aw, h:r.ah };
	}
	if (!rect){
	  /* 回退：按逻辑尺寸 × resScale 估原图像素（缺 res.json 时） */
	  const aw = Math.max(1, Math.round(logicalSize[0] * resScale));
	  const ah = Math.max(1, Math.round(logicalSize[1] * resScale));
	  rect = { x:0, y:0, w:aw, h:ah };
	  src = 'fallback';
	}
	/* 夹到图集范围，防止越界 */
	const cw = Math.max(1, Math.min(rect.w, Math.max(1, atlasW - rect.x)));
	const chh = Math.max(1, Math.min(rect.h, Math.max(1, atlasH - rect.y)));
	/* ★ [坑23 · 保留图集原始密度] 旧实现把子图**缩放到逻辑尺寸**再存进 amproj，
	   等于在源头就把 res/1200(=1.28) 的分辨率丢掉了 —— AM→PAM 回程时无论怎么
	   补都只能插值，这就是「密度 false 帧差小但 aw/ah 不对、密度 true 格式对
	   但帧差 5.99%」这个两难的根因。
	   正确做法：PNG media 里**原样保留图集像素**（cw×chh，即 1.28 密度），
	   逻辑尺寸单独记为 logicalW/H，仅用于 shape 的显示矩形与坐标换算。
	   AM 的 mediaFillMode="fill" + s=".rect" 会自动把高像素 PNG 缩到显示矩形，
	   渲染结果与旧版完全一致，但回程裁出来的就是 1.28 密度、**全程无插值**。
	   （若源三件套本身就是密度 1.0，则 cw===lw，此改动无副作用。） */
	const lw = logicalSize[0] > 0 ? logicalSize[0] : cw;
	const lh = logicalSize[1] > 0 ? logicalSize[1] : chh;
	/* cvs = 逻辑尺寸（渲染器 makePamRenderer 依赖「cvs 尺寸 == 逻辑尺寸」这一约定，
	   不能动）；srcCvs = 图集原始像素（1.28 密度），仅供 pamToAmproj 导出 PNG。 */
	const scv = newCanvas(cw, chh), sctx = scv.getContext('2d');
	sctx.drawImage(bmp, rect.x, rect.y, cw, chh, 0, 0, cw, chh);
	const cv = newCanvas(lw, lh), ctx = cv.getContext('2d');
	ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
	ctx.drawImage(bmp, rect.x, rect.y, cw, chh, 0, 0, lw, lh);

	images.push({ index:i, logical, rid, logicalSize, mat, imgMat,
		  logicalW: lw, logicalH: lh, scaleX: lw/cw, scaleY: lh/chh,
		  rect:{ x:rect.x, y:rect.y, w:cw, h:chh }, src,
		  cvs:cv, srcCvs: (cw === lw && chh === lh) ? null : scv, png:null });
  }
  return images;
}

/* ── PopAnim 子 sprite 解析：把 sprite[j] 摊平成「第 t 帧显示哪个 image」的序列 ──
   实测每个 sprite 只有 1 帧，其元素通过 append(resource=图片 index) 指定素材。 */
/* 递归解析 sprite → 实际素材图索引。
   ★ PAM 的 sprite 可以**嵌套**（sprite 里 append 的还是 sprite，例如
	 zombie_egypt_ra_arms_outer_upper → [upper_arm, lower_arm]，再套到 image）。
	 旧实现只看第一层 append[0]，遇到「整个 sprite 全是子 sprite」就返回 -1，
	 该元件被当成无素材直接跳过 —— 实测表现为「太阳神僵尸红色技能光效整块丢失」
	 （帧差从 ~1% 飙到 ~11%）。这里改为深度优先，返回该 sprite 子树里
	 第一个能到达的 image 索引；同时把子树里所有元素的变换也一并展开。 */
function spriteFirstImage(pam, spriteIdx, seen){
  if (spriteIdx == null || spriteIdx < 0) return -1;
  const sp = pam.sprite && pam.sprite[spriteIdx];
  if (!sp || !sp.frame || !sp.frame.length) return -1;
  seen = seen || new Set();
  if (seen.has(spriteIdx)) return -1;      // 防环
  seen.add(spriteIdx);
  for (const fr of sp.frame){
	for (const a of (fr.append || [])){
	  if (a.sprite) {
		const r = spriteFirstImage(pam, a.resource, seen);
		if (r >= 0) return r;
	  } else if ((a.resource | 0) >= 0 && (a.resource | 0) < pam.image.length){
		return a.resource | 0;
	  }
	}
  }
  return -1;
}
function buildSpriteImageRefs(pam){
  const refs = [];   // refs[j] = { imgIdx, frames, kids:[...] }
  for (let j=0;j<(pam.sprite||[]).length;j++){
	const sp = pam.sprite[j];
	const kids = [];
	if (sp && sp.frame && sp.frame.length){
	  for (const a of (sp.frame[0].append || [])) kids.push({ resource: a.resource|0, sprite: !!a.sprite });
	}
	refs.push({ imgIdx: spriteFirstImage(pam, j), frames: sp && sp.frame ? sp.frame.length : 1, kids });
  }
  return refs;
}
/* 元素 → 素材图索引：sprite 元素查 sprite→image 映射，普通元素直接用 resource */
function elementImageIndex(pam, spriteRefs, life){
  const map = new Map();
  for (const [idx, e] of life){
	map.set(idx, e.sprite ? (spriteRefs[e.resource] ? spriteRefs[e.resource].imgIdx : -1) : e.resource);
  }

}
/* 逐帧渲染 PopAnim（用于预览/自测）。坐标系=画布绝对像素，原点在画布左上。
   ★ 完整实现 sprite 复合：一个 sprite 元素 = 把它的子元素（image 或再嵌套 sprite）
	 按 Mparent·Mchild·Mimage 逐层复合后绘制。旧实现把 sprite 元素直接当成
	 单张 image 画，嵌套 sprite（子树全是 sprite）会画不出来 —— 实测红色技能光效丢失。 */
function makePamRenderer(pam, images){
  const spriteRefs = buildSpriteImageRefs(pam);
  const life = buildElementLife(pam);
  const elemImg = elementImageIndex(pam, spriteRefs, life);
  const frames = pam.main_sprite.frame;
  /* 每个 sprite 的各帧「已解析绘制列表」：items=[{img,mat}]，
