/* ★ [坑32] 「按备忘录还原」：直接从 memo 的逐帧 label 记录重建分段，
   免去用户手工推算帧号（也就不会再撞上「与第 1 行 all 重叠」这类校验错误）。
   帧数对不上（在 AM 里改过长度）时按比例映射并夹紧，保证区间互斥、不越界。 */
/* 把备忘录的逐帧 label 记录转成互斥的帧区间表。total 为当前 AM 总帧数，
   帧数对不上时按比例映射并夹紧，保证「不重叠、不越界、不留缝」。 */
function labelRowsFromMemo(memo, total){
  const fm = memo && memo.main_sprite && Array.isArray(memo.main_sprite.frameMeta) ? memo.main_sprite.frameMeta : null;
  if (!fm || !fm.length) return null;
  const N = total || Math.max(1, fm.length);
  const segs = [];
  for (let i=0;i<fm.length;i++) if (fm[i].label) segs.push({ name: fm[i].label, s: i });
  if (!segs.length) return null;
  for (let k=0;k<segs.length;k++) segs[k].e = (k+1 < segs.length) ? (segs[k+1].s - 1) : (fm.length - 1);
  const scale = (fm.length !== N) ? (N - 1) / Math.max(1, fm.length - 1) : 1;
  const rows = [];
  for (let k=0;k<segs.length;k++){
	let a = Math.round(segs[k].s * scale), b = Math.round(segs[k].e * scale);
	a = Math.max(0, Math.min(N - 1, a)); b = Math.max(0, Math.min(N - 1, b));
	if (rows.length && a <= rows[rows.length-1].end) a = rows[rows.length-1].end + 1;
	if (a > b) continue;
	rows.push({ start:a, end:b, name:segs[k].name });
  }
  if (rows.length && rows[rows.length-1].end < N - 1) rows[rows.length-1].end = N - 1;
  if (!rows.length) rows.push({ start:0, end:N-1, name:'all' });
  return { rows, srcFrames: fm.length, scale };
}
/* 当前可用的备忘录：转换时解析过的 > 上传时多选附带的 */
function currentMemo(){
  if (typeof CUR_MEMO !== 'undefined' && CUR_MEMO) return CUR_MEMO;
  if (typeof EXTRA_MEMO !== 'undefined' && EXTRA_MEMO && EXTRA_MEMO.bytes){
	try { return JSON.parse(dec.decode(EXTRA_MEMO.bytes)); } catch(_){ return null; }
  }
  return null;
}
/* 「按素材自动分组」= 按 AM 里各图层的名字与可见区间切段；
   「按备忘录分组」  = 按原版三件套记录的逐帧 label 切段（帧号最准）。
   两者并存，用户可任选；有备忘录时优先推荐后者。 */
$('labelMemoBtn').onclick = () => {
  const memo = currentMemo();
  const fm = memo && memo.main_sprite && Array.isArray(memo.main_sprite.frameMeta) ? memo.main_sprite.frameMeta : null;
  const total = AM_TOTAL_FRAMES || 1;
  const built = labelRowsFromMemo(memo, total);
  if (!built){ log('没有可用的备忘录，或备忘录里没记录 label（请先上传带 pam_memo.txt 的 amproj，或同时多选该 txt）', 'w'); return; }
  CUR_MEMO = memo;
  renderLabelRows(built.rows);
  const v = validateLabelsUI();
  log('  已从备忘录还原 ' + built.rows.length + ' 条 label'
	+ (built.scale !== 1 ? '（原 ' + built.srcFrames + ' 帧 → 现 ' + total + ' 帧，按比例映射）' : '')
	+ (v.ok ? '' : '；仍有问题：' + v.errs[0]), v.ok ? 'ok' : 'w');
};

/* ══════════════════════════════════════════════════════════════════════════
   13 · 新模式接线：runConvert / 预览 / 自测 / 下载
   ══════════════════════════════════════════════════════════════════════════ */
let CUR_TRIPLET = null;    // pam2am 模式的源三件套
let CUR_AM_MODEL = null;   // am2pam 模式的源 amproj 模型
let CUR_PAM_RENDER = null; // 三件套渲染器
let CUR_MEMO = null;       // 当前生效的格式备忘录（供 label 面板还原原版分段）

/* 扩展 runConvert：新增 pam2am / am2pam 两个分支 */
const _runConvertBase = runConvert;
runConvert = async function(){
  if (!SRC) return;
  if (MODE !== 'pam2am' && MODE !== 'am2pam') return _runConvertBase();
  logClear();
  if (MODE === 'pam2am') await runPam2Am();
  else await runAm2Pam();
};

async function runPam2Am(){
  log('模式: 原版三件套 → AM');
  log('解压 ' + SRC.name + ' …');
  const files = await unzip(SRC.bytes);
  log('  条目数: ' + files.size, 'ok');
  const triplet = parseTriplet(files);
  const { pam } = triplet;
  const labels = pamLabelRanges(pam);
  const life = buildElementLife(pam);
  log('  PAM v' + pam.version + ': ' + pam.size[0] + 'x' + pam.size[1] + ' @' + pam.frame_rate + 'fps, image '
	+ pam.image.length + ' 张, sprite ' + pam.sprite.length + ' 个, 主帧 ' + pam.main_sprite.frame.length
	+ ', 元件 ' + life.size + ' 个', 'ok');
  log('  label: ' + labels.map(l => l.name + '(' + l.start + '~' + (l.end-1) + ')').join(', '), 'ok');
  const images = await sliceTripletImages(triplet);
  const t0 = performance.now();
  const res = pamToAmproj(pam, images, baseName(SRC.name), triplet.res);
  const ms = performance.now() - t0;
  OUT = { name: baseName(SRC.name) + '.amproj', bytes: res.bytes, kind: 'amproj' };
  /* 备忘录单独交付：不进 amproj 包（AM 会丢），单独下载留档 */
  OUT_MEMO = res.memoBytes ? { name: baseName(SRC.name) + '.' + MEMO_FILE, bytes: res.memoBytes } : null;
  if (OUT_MEMO) log('  备忘录已单独生成（' + (OUT_MEMO.bytes.length/1024).toFixed(0)
	+ ' KB），请点「下载备忘录 txt」保存 —— AM 编辑后需与新版 amproj 一起上传', 'ok');
  log('  输出 ' + res.shapes + ' 个 shape / ' + res.subCount + ' 张子图（各自一张 PNG media）, '
	+ (res.bytes.length/1024).toFixed(0) + ' KB，耗时 ' + ms.toFixed(0) + 'ms', 'ok');
  log('  ✓ 同一 label 内每个元件=一个 shape（逐帧为主关键帧），无逐帧膨胀', 'ok');

  /* 预览：左=原版 PAM 逐帧，右=转换后 amproj 逐帧 */
  const amFiles = await unzip(res.bytes);
  const model = parseAmproj(amFiles);
  await decodeAmTextures(model);
  const pr = makePamRenderer(pam, images);
  PV = { mode:'pam2am', W:res.W, H:res.H, fps:res.fps, model, pamRender:pr,
		 totalFrames: pam.main_sprite.frame.length, bgA:'#00000000', bgB:model.bgcolor };
  $('info').innerHTML = kv('画布', res.W + ' × ' + res.H)
	+ kv('帧率', res.fps + ' fps') + kv('总帧数', PV.totalFrames)
	+ kv('原版元件', life.size) + kv('输出 shape', res.shapes)
	+ kv('素材', res.subCount + ' 张 PNG（各自独立 media）')
	+ kv('label 数', labels.length);
  $('tA').textContent = '原始 原版三件套(PAM)'; $('tB').textContent = '转换后 AMPROJ';
  finish(PV.totalFrames);
}

async function runAm2Pam(){
  log('模式: AM → 原版三件套');
  log('解压 ' + SRC.name + ' …');
  const files = await unzip(SRC.bytes);
  const model = parseAmproj(files);
  await decodeAmTextures(model);
  CUR_AM_MODEL = model;
  /* ★ [修改模式] 自动检测：amproj 包里若带着 pam_memo.txt，说明它是从原版
	 三件套转来的。此时按备忘录还原格式骨架（元件名 / sprite 定义 / res /
	 资源路径），保证「三件套 → AM → 改动画 → AM → 三件套」后骨架分毫不差。 */
  let memo = null;
  const memoBytes = files.get(MEMO_FILE) || (EXTRA_MEMO ? EXTRA_MEMO.bytes : null);
  if (!files.get(MEMO_FILE) && EXTRA_MEMO) log('  ✓ 使用了多选附带的 ' + EXTRA_MEMO.name, 'ok');
  if (memoBytes){
	try {
	  memo = JSON.parse(dec.decode(memoBytes) || JSON.stringify(memoBytes));
	  log('  ✓ 检测到 ' + MEMO_FILE + '，启用修改模式：按原版骨架还原'
		+ '（res=' + (memo.res || '?') + ', sprite ' + ((memo.sprite && memo.sprite.length) || 0) + ' 条）', 'ok');
	} catch(e){
	  memo = null;
	  log('  ⚠ ' + MEMO_FILE + ' 解析失败，已忽略，改用默认骨架', 'w');
	}
  } else {
	log('  未检测到 ' + MEMO_FILE + '，按默认骨架导出（元件名将使用素材名）', 'w');
  }
  CUR_MEMO = memo;
  const fps = model.fps || 30;
  AM_TOTAL_FRAMES = Math.max(1, Math.round(model.totalTime / 1000 * fps));
  /* 若用户尚未编辑 label 配置（只有默认行），按总帧数刷新默认 all */
  const rowsNow = labelRowsData();
  if (rowsNow.length <= 1) renderLabelRows(defaultLabelRows());
  else validateLabelsUI();
  log('  AM: ' + model.width + 'x' + model.height + ' @' + fps + 'fps, shape '
	+ model.shapes.length + ' 个, 素材 ' + model.media.size + ', 时长 '
	+ model.totalTime.toFixed(0) + 'ms / ' + AM_TOTAL_FRAMES + ' 帧', 'ok');

  const v = validateLabelsUI();
  if (!v.ok){
	log('  ✗ label 配置非法，已中止。请修正下方 label 帧区间。', 'e');
	throw new Error('label 配置非法：' + v.errs[0]);
  }
  const labelCfg = v.rows.map(r => ({ start:r.start, end:r.end, name:r.name, cmd:r.cmd, rel:r.rel }));

  const t0 = performance.now();
  const res = await amprojToTriplet(model, labelCfg, baseName(SRC.name), memo);
  /* 三件套 zip 里已含备忘录；这里额外挂一份供单独下载留档 */
  OUT_MEMO = res.memoBytes ? { name: baseName(SRC.name) + '.' + MEMO_FILE, bytes: res.memoBytes } : null;
  const ms = performance.now() - t0;
  OUT = { name: baseName(SRC.name) + '_triplet.zip', bytes: res.bytes, kind: 'zip' };
  log('  输出 ' + res.images + ' 张子图 → 图集 ' + res.W + '×' + res.H
	+ (res.scale<1?'（子图缩放 '+(res.scale*100).toFixed(0)+'%）':'')
	+ ', res=' + res.res + ', sprite ' + res.spriteCount + ' 条, '
	+ res.labels + ' 条 label, ' + (res.bytes.length/1024).toFixed(0) + ' KB，耗时 ' + ms.toFixed(0) + 'ms', 'ok');
  log('  ✓ 三件套：' + baseName(SRC.name) + '.png / .res.json / .PAM.am.json（严格对齐 PopStudio 规范）', 'ok');

  /* 预览：左=原始 amproj，右=导出的三件套 */
  const tripFiles = await unzip(res.bytes);
  const triplet = parseTriplet(tripFiles);
  const images = await sliceTripletImages(triplet);
  const pr = makePamRenderer(triplet.pam, images);
  CUR_TRIPLET = triplet; CUR_PAM_RENDER = pr;
  PV = { mode:'am2pam', W:model.width, H:model.height, fps, model, pamRender:pr,
		 totalFrames: AM_TOTAL_FRAMES, bgA:model.bgcolor, bgB:'#00000000' };
  $('info').innerHTML = kv('画布', model.width + ' × ' + model.height)
	+ kv('帧率', fps + ' fps') + kv('总帧数', AM_TOTAL_FRAMES)
	+ kv('AM shape', model.shapes.length) + kv('输出元件', triplet.pam.main_sprite.frame.reduce((s,f)=>s+f.append.length,0))
	+ kv('输出 label', labelCfg.length) + kv('图集', res.W + '×' + res.H + (res.scale<1 ? ' (缩放'+(res.scale*100).toFixed(0)+'%)' : ''));
  $('tA').textContent = '原始 AMPROJ'; $('tB').textContent = '导出的原版三件套';
  finish(PV.totalFrames);
}

/* finishConvert 的公共收尾（pam2am 用） */
function finish(totalFrames){
  const fr = $('frame'); fr.max = String(totalFrames - 1); fr.value = '0';
  $('infoCard').style.display = '';
  $('dlBtn').disabled = false;
  $('dlMemoBtn').disabled = !OUT_MEMO;
  $('statLine').textContent = '完成：' + OUT.name + (OUT_MEMO ? '（备忘录请单独下载保存）' : '');
  paintPreview(0);
}
/* 覆盖原 runConvert 的收尾为可复用函数（保持 FLA 分支行为不变） */
const _paintPreviewBase = paintPreview;

/* 扩展预览渲染 */
drawSide = function(ctx, side, frameIdx){
  const st = PV;
  const tMs = frameIdx / st.fps * 1000;
  const bg = (side === 'A') ? st.bgA : st.bgB;
  if (bg && bg !== '#00000000'){ ctx.fillStyle = bg; ctx.fillRect(0, 0, st.W, st.H); }
  const isPam = (st.mode === 'pam2am' || st.mode === 'am2pam');
  if (!isPam){
	/* 原有两种模式：沿用旧逻辑 */
	if (side === 'A'){
	  if (st.mode === 'fla2am') renderTimeline(ctx, st.doc.main, frameIdx, st.doc, 0);
	  else renderAmFrame(ctx, st.model, tMs);
	} else {
	  if (st.mode === 'fla2am') renderAmFrame(ctx, st.model, tMs);
	  else renderTimeline(ctx, st.doc.main, frameIdx, st.doc, 0);
	}
	return;
  }
  /* 新模式：一侧渲染 amproj，另一侧渲染 PAM */
  const renderAm = () => renderAmFrame(ctx, st.model, tMs);
  const renderPam = () => st.pamRender.draw(ctx, frameIdx);
  if (st.mode === 'pam2am'){ if (side === 'A') renderPam(); else renderAm(); }
  else { if (side === 'A') renderAm(); else renderPam(); }
};

/* 扩展往返自测 */
const _selfTestBase = selfTest;
selfTest = async function(){
  if (!SRC) return;
  if (MODE !== 'pam2am' && MODE !== 'am2pam') return _selfTestBase();
  logClear();
  log('往返自测开始…', 'ok');
  const files = await unzip(SRC.bytes);
  const sampleFrames = 12;
  if (MODE === 'pam2am'){
	/* PAM → AM → PAM：比对两版三件套逐帧渲染 */
	const trip0 = parseTriplet(files);
	const images0 = await sliceTripletImages(trip0);
	const r1 = pamToAmproj(trip0.pam, images0, baseName(SRC.name), trip0.res);
	const files1 = await unzip(r1.bytes);
	const model1 = parseAmproj(files1); await decodeAmTextures(model1);
	const v = validateLabels([{ start:0, end:trip0.pam.main_sprite.frame.length-1, name:'all' }], 0);
	/* 自测同样走「自动检测备忘录」这条路，模拟真实往返 */
	/* 备忘录已不随 amproj 包交付，直接用 pamToAmproj 的返回值（等价于用户把
	   单独下载的 txt 再上传） */
	const memo1 = r1.memo || null;
	const r2 = await amprojToTriplet(model1, v.rows, baseName(SRC.name), memo1);
	const files2 = await unzip(r2.bytes);
	const trip1 = parseTriplet(files2);
	const images1 = await sliceTripletImages(trip1);
	const prA = makePamRenderer(trip0.pam, images0);
	const prB = makePamRenderer(trip1.pam, images1);
	const total = trip0.pam.main_sprite.frame.length;
	const errs = [];
	/* ★ 画布必须覆盖 PAM 的坐标空间：PAM 的 tx/ty 最大可到 pam.size（太阳神僵尸
	   坐标 130~250，配合 100+ 的子图会超过 390），amproj 的 W/H 只是「逻辑画布」，
	   直接拿它当比较画布会把边缘元件裁掉，虚报 35% 的不一致。
	   这里用 pam.size + 200 余量，保证两边都完整入镜。 */
	const cw = Math.max(trip0.pam.size[0], trip1.pam.size[0]) + 200;
	const ch = Math.max(trip0.pam.size[1], trip1.pam.size[1]) + 200;
	for (let i=0;i<sampleFrames;i++){
	  const fr = Math.round(i * (total-1) / Math.max(1, sampleFrames-1));
	  const a = newCanvas(cw, ch), b = newCanvas(cw, ch);
	  prA.draw(a.getContext('2d'), fr); prB.draw(b.getContext('2d'), fr);
	  errs.push({ frame: fr, pct: diffCanvases(a, b).pct });
	}
	report(errs, 'PAM→AM→PAM（原版→AM→原版）');
  } else {
	/* AM → PAM → AM */
	const model0 = parseAmproj(files); await decodeAmTextures(model0);
	const fps = model0.fps || 30;
	const total = Math.max(1, Math.round(model0.totalTime/1000*fps));
	const v = validateLabels([{ start:0, end:total-1, name:'all' }], total);
	const r1 = await amprojToTriplet(model0, v.rows, baseName(SRC.name));
	const files1 = await unzip(r1.bytes);
	const trip = parseTriplet(files1);
	const images = await sliceTripletImages(trip);
	const r2 = pamToAmproj(trip.pam, images, baseName(SRC.name), trip.res);
	const files2 = await unzip(r2.bytes);
	const model1 = parseAmproj(files2); await decodeAmTextures(model1);
	const errs = [];
	for (let i=0;i<sampleFrames;i++){
	  const fr = Math.round(i * (total-1) / Math.max(1, sampleFrames-1));
	  const tms = fr / fps * 1000;
	  const a = newCanvas(model0.width, model0.height), b = newCanvas(model1.width, model1.height);
	  renderAmFrame(a.getContext('2d'), model0, tms);
	  renderAmFrame(b.getContext('2d'), model1, tms);
	  errs.push({ frame: fr, pct: diffCanvases(a, b).pct });
	}
	report(errs, 'AM→PAM→AM（AM→原版→AM）');
  }
};

/* 文件选择 / URL 载入时也要刷新 label 面板与按钮态 */
(function patchLoaders(){
  const oldChange = $('fileIn').onchange;
  $('fileIn').onchange = async e => {
	await oldChange(e);
	if (MODE === 'am2pam' && SRC){ try { await primeAm2PamUI(); } catch(_){} }
	else if (MODE === 'pam2am'){ $('goBtn').disabled = !SRC; }
  };
  const oldUrl = $('urlBtn').onclick;
  $('urlBtn').onclick = async () => {
	await oldUrl();
	if (MODE === 'am2pam' && SRC){ try { await primeAm2PamUI(); } catch(_){} }
	else if (MODE === 'pam2am'){ $('goBtn').disabled = !SRC; }
  };
})();
async function primeAm2PamUI(){
  try {
	const files = await unzip(SRC.bytes);
	const model = parseAmproj(files);
	CUR_AM_MODEL = model;
	const fps = model.fps || 30;
	AM_TOTAL_FRAMES = Math.max(1, Math.round(model.totalTime / 1000 * fps));
	/* 备忘录来源：包内 > 多选附带的独立 txt */
	let m = null, mSrc = '';
	if (files.get(MEMO_FILE)){
	  try { m = JSON.parse(dec.decode(files.get(MEMO_FILE))); mSrc = MEMO_FILE; } catch(_){ m = null; }
	  if (!m) log('  ⚠ ' + MEMO_FILE + ' 存在但无法解析，将改用默认骨架', 'w');
	}
	if (!m && typeof EXTRA_MEMO !== 'undefined' && EXTRA_MEMO && EXTRA_MEMO.bytes){
	  try { m = JSON.parse(dec.decode(EXTRA_MEMO.bytes)); mSrc = EXTRA_MEMO.name; } catch(_){ m = null; }
	}
	CUR_MEMO = m || null;
	if (m){
	  log('  ✓ 检测到备忘录' + (mSrc ? '（' + mSrc + '）' : '') + '：启用修改模式（按原版骨架还原 res='
		+ (m.res||'?') + ', sprite ' + ((m.sprite&&m.sprite.length)||0)
		+ ' 条, image ' + ((m.image&&m.image.length)||0) + ' 条）', 'ok');
	}
	/* ★ [坑32] 有备忘录就**直接把原版 label 分段铺好**，别让用户对着
	   默认的单行 all 手工拆 —— 那正是「第 2 行与第 1 行重叠」这类报错的来源。
	   帧数对不上（在 AM 里改过长度）时按比例映射，保证区间互斥不越界。 */
	const built = m ? labelRowsFromMemo(m, AM_TOTAL_FRAMES) : null;
	renderLabelRows((built && built.rows.length > 1) ? built.rows : defaultLabelRows());
	if (built && built.rows.length > 1){
	  log('  ✓ 已按备忘录自动还原 ' + built.rows.length + ' 条原版 label 分段'
		+ (built.scale !== 1 ? '（原 ' + built.srcFrames + ' 帧 → 现 ' + AM_TOTAL_FRAMES + ' 帧，按比例映射）' : '')
		+ '，可直接转换；如需自定义再手动改', 'ok');
	}
	if (!m) {
	  log('  未检测到 ' + MEMO_FILE + '：按默认骨架导出（元件名取自素材，res=' + PAM_DEFAULT_RES + '）', 'w');
	}
  } catch(e){ log('  预读 amproj 失败：' + e.message, 'w'); }
}

/* 覆写 setMode 的按钮态初始化，保证切到新模式时 label 面板/按钮正确 */
const _setModeBase = setMode;
setMode = function(m){
  _setModeBase(m);
  if (m === 'am2pam'){
	if (!labelRowsData().length) renderLabelRows(defaultLabelRows());
	validateLabelsUI();
  } else {
	$('goBtn').disabled = !SRC;
  }
};

setMode('fla2am');
log('就绪。选择 .fla / .amproj / 三件套 .zip 后点「转换」。', 'ok');
